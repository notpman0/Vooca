/* ---------------- Word Lists ---------------- */
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// Google (and some other providers) tell you exactly how long to wait on a
// 429, either as a RetryInfo detail or embedded in the message text (e.g.
// "Please retry in 48.86254s."). Use that instead of guessing — a real
// rate-limit reset is often much longer than a generic backoff would try.
function parseRetryDelayMs(errBody) {
  try {
    const details = errBody?.error?.details;
    if (Array.isArray(details)) {
      const info = details.find((d) => String(d["@type"] || "").includes("RetryInfo"));
      if (info?.retryDelay) {
        const secs = parseFloat(info.retryDelay);
        if (Number.isFinite(secs)) return Math.ceil(secs * 1000);
      }
    }
    const match = String(errBody?.error?.message || "").match(/retry in ([\d.]+)\s*s/i);
    if (match) return Math.ceil(parseFloat(match[1]) * 1000);
  } catch { /* fall through to generic backoff */ }
  return null;
}

async function fetchWithRetry(url, options, { retries = 3 } = {}) {
  let lastErr;
  for (let attempt = 0; attempt <= retries; attempt++) {
    let res;
    try {
      res = await fetch(url, options);
    } catch (netErr) {
      if (url === OPENAI_PROXY_URL) {
        throw new Error("The GPT relay server isn't reachable — it likely hasn't been deployed yet. Check Settings for relay status, or try Claude/Gemini in the meantime.");
      }
      lastErr = new Error(`Network error — check your connection. (${netErr.message})`);
      await sleep(Math.min(8000, 800 * 2 ** attempt) + Math.random() * 300);
      continue;
    }
    if (res.ok) return res.json();
    const e = await res.json().catch(() => ({}));
    const msg = e?.error?.message || `Request failed (HTTP ${res.status})`;
    lastErr = new Error(msg);
    if (res.status === 429 || res.status >= 500) {
      const suggested = res.status === 429 ? parseRetryDelayMs(e) : null;
      const delay = suggested != null ? Math.min(65000, suggested + 500) : Math.min(8000, 800 * 2 ** attempt) + Math.random() * 300;
      await sleep(delay);
      continue; // retryable — rate limit or server hiccup
    }
    throw lastErr; // not retryable (bad key, bad request, etc.) — fail fast
  }
  throw lastErr;
}

// Free-tier request-per-minute limits vary a lot by provider — Gemini's free
// tier is by far the tightest (20/min), so loops that fire several AI calls
// in a row need real breathing room between them or they trip it almost
// immediately. Anthropic/OpenAI don't need this.
function providerThrottleMs(provider) {
  return provider === "gemini" ? 3500 : 300;
}

/* Unified entry point for all three providers. Returns plain response text.
   Anthropic and Gemini both allow direct browser requests; OpenAI's API
   rejects browser CORS requests outright, so it's routed through a small
   stateless relay (see OPENAI_PROXY_URL) that only forwards the caller's
   own key — it never stores or sees it beyond that single request. */
async function callAI({ provider, apiKey, model, system, userText, images, maxTokens = 1024 }) {
  if (!apiKey) throw new Error("No API key set for this provider.");

  if (provider === "gemini") {
    const parts = [];
    if (images) images.forEach((img) => parts.push({ inline_data: { mime_type: "image/png", data: img } }));
    parts.push({ text: userText });
    const data = await fetchWithRetry(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`,
      { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents: [{ role: "user", parts }],
          generationConfig: { maxOutputTokens: maxTokens } }) }
    );
    const cand = data.candidates?.[0];
    if (!cand) throw new Error(data.promptFeedback?.blockReason ? `Blocked: ${data.promptFeedback.blockReason}` : "Gemini returned no response.");
    return (cand.content?.parts || []).map((p) => p.text || "").join("").trim();
  }

  if (provider === "openai") {
    const content = images
      ? [{ type: "text", text: userText }, ...images.map((img) => ({ type: "image_url", image_url: { url: `data:image/png;base64,${img}` } }))]
      : userText;
    const data = await fetchWithRetry(OPENAI_PROXY_URL, {
      method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${apiKey}` },
      body: JSON.stringify({ model, max_tokens: maxTokens, messages: [{ role: "system", content: system }, { role: "user", content }] }),
    });
    return (data.choices?.[0]?.message?.content || "").trim();
  }

  // default: anthropic
  const content = images
    ? [...images.map((img) => ({ type: "image", source: { type: "base64", media_type: "image/png", data: img } })), { type: "text", text: userText }]
    : userText;
  const data = await fetchWithRetry("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({ model, max_tokens: maxTokens, system, messages: [{ role: "user", content }] }),
  });
  return data.content.map((b) => (b.type === "text" ? b.text : "")).join("").trim();
}

async function fetchDefinition(word, apiKey, model, provider = DEFAULT_PROVIDER) {
  const system = `You are a lexicographer. Given a single English word, return ONLY valid JSON (no markdown, no preamble) matching exactly:
{"def": string, "vibe": "formal"|"academic"|"casual"|"literary", "coll": string}
"def" is one clear sentence. "vibe" is the register the word most naturally belongs to. "coll" is 3 comma-separated natural collocations.`;
  const raw = await callAI({ provider, apiKey, model, system, userText: `Word: ${word}`, maxTokens: 300 });
  return JSON.parse(raw.replace(/```json|```/g, "").trim());
}

/* Defines many words in one shot instead of one request per word — much
   faster for a batch of imports, especially on slower models. Returns a
   map of lowercase word -> {def, vibe, coll}; batches internally at 30
   words per request so very large lists still work in a handful of calls. */
async function fetchDefinitionsBatch(words, apiKey, model, provider, onProgress) {
  const system = `You are a lexicographer. Given a list of English words, define each one. Return ONLY valid JSON (no markdown, no preamble): an array with exactly one object per word, in the same order given: [{"word": string, "def": string, "vibe": "formal"|"academic"|"casual"|"literary", "coll": string}]. "def" is one clear sentence. "vibe" is the register the word most naturally belongs to. "coll" is 3 comma-separated natural collocations for that word.`;
  const BATCH = 30;
  const batches = [];
  for (let i = 0; i < words.length; i += BATCH) batches.push(words.slice(i, i + BATCH));
  const results = {};
  for (let b = 0; b < batches.length; b++) {
    onProgress && onProgress(b + 1, batches.length);
    if (b > 0) await sleep(providerThrottleMs(provider));
    try {
      const raw = await callAI({ provider, apiKey, model, system, userText: `Words:\n${batches[b].join("\n")}`, maxTokens: Math.min(4000, batches[b].length * 100) });
      const parsed = extractJsonArray(raw);
      if (Array.isArray(parsed)) parsed.forEach((p) => { if (p?.word) results[p.word.trim().toLowerCase()] = p; });
    } catch { /* skip this batch on failure — remaining words simply stay unfilled */ }
  }
  return results;
}

/* Free, keyless definition lookup via Datamuse (backed by WordNet) — works
   for most real English words with no API key at all. This is the primary
   definition source; AI is only used as enrichment (vibe/collocations) or
   as a fallback for words the free dictionary doesn't recognize. */
function cleanDatamuseDef(raw) {
  // Datamuse defs look like "v\t(transitive) To reduce, lessen, or decrease..."
  const tab = raw.indexOf("\t");
  let text = tab === -1 ? raw : raw.slice(tab + 1);
  return text.trim().replace(/\s+/g, " ");
}

async function freeDictLookup(word) {
  const res = await fetch(`https://api.datamuse.com/words?sp=${encodeURIComponent(word.trim())}&md=d&max=1`);
  if (!res.ok) return null;
  const data = await res.json();
  const entry = data[0];
  if (!entry || !entry.defs || !entry.defs.length || entry.word.toLowerCase() !== word.trim().toLowerCase()) return null;
  return { def: cleanDatamuseDef(entry.defs[0]) };
}

async function fetchSuggestions(query) {
  const q = query.trim();
  if (!q) return [];
  const [sug, ml] = await Promise.all([
    fetch(`https://api.datamuse.com/sug?s=${encodeURIComponent(q)}&max=6`).then((r) => r.json()).catch(() => []),
    q.length >= 3
      ? fetch(`https://api.datamuse.com/words?ml=${encodeURIComponent(q)}&max=6`).then((r) => r.json()).catch(() => [])
      : Promise.resolve([]),
  ]);
  const seen = new Set();
  const merged = [];
  [...sug, ...ml].forEach((item) => {
    const w = item.word.toLowerCase();
    if (seen.has(w) || !/^[a-z][a-z '-]*$/.test(w)) return;
    seen.add(w);
    merged.push(item.word);
  });
  return merged.slice(0, 8);
}

async function searchDictionary(word, apiKey, model, provider) {
  const free = await freeDictLookup(word).catch(() => null);
  let extra = null;
  if (apiKey) {
    const system = `You are a bilingual English-Chinese dictionary. Given an English word, respond with ONLY valid JSON (no markdown, no preamble): {"def": string, "chinese": string, "vibe": "formal"|"academic"|"casual"|"literary", "coll": string}. "def" is one clear English sentence (only needed if you're confident; otherwise empty string). "chinese" is a concise Simplified Chinese translation/definition. "coll" is 3 comma-separated natural English collocations.`;
    try {
      const raw = await callAI({ provider, apiKey, model, system, userText: `Word: ${word}`, maxTokens: 250 });
      extra = JSON.parse(raw.replace(/```json|```/g, "").trim());
    } catch { /* Chinese/enrichment is optional — English def alone is still useful */ }
  }
  const def = free?.def || extra?.def || "";
  if (!def && !extra) return null;
  return { word, def, chinese: extra?.chinese || "", vibe: extra?.vibe || "formal", coll: extra?.coll || "" };
}

// Real, corpus-sourced example sentences (Wiktionary quotations, via the free
// dictionaryapi.dev). Best-effort — that service is occasionally flaky for a
// given word (times out / 5xx), so callers must tolerate an empty result and
// fall back to a synthesized sentence rather than break.
async function fetchRealExamples(word) {
  try {
    const res = await fetch(`${LEADERBOARD_BASE}/dictionary-examples?word=${encodeURIComponent(word.trim().toLowerCase())}`);
    if (!res.ok) return [];
    const data = await res.json();
    return Array.isArray(data.examples) ? data.examples : [];
  } catch { return []; }
}

// AI fallback for words the free dictionary has no real example for — only
// used when the user has their own API key set, and only for the handful of
// words that still came back empty after fetchExamplesBatch.
async function fetchAiExamplesBatch(words, apiKey, model, provider) {
  if (!words.length) return {};
  const system = `You write natural example sentences for a vocabulary app. Given a list of English words (each with its register/"vibe"), write 2 realistic sentences per word that actually demonstrate its meaning in use — not a fill-in-the-blank template, real varied sentences a native speaker might write. Return ONLY valid JSON (no markdown, no preamble): an array with one object per word, same order: [{"word": string, "examples": [string, string]}]`;
  const userText = words.map((w) => `${w.word} (${w.vibe || "formal"})`).join("\n");
  try {
    const raw = await callAI({ provider, apiKey, model, system, userText, maxTokens: Math.min(4000, words.length * 150) });
    const parsed = extractJsonArray(raw);
    const out = {};
    if (Array.isArray(parsed)) {
      parsed.forEach((p) => {
        if (p?.word && Array.isArray(p.examples) && p.examples.length) out[p.word.trim().toLowerCase()] = p.examples;
      });
    }
    return out;
  } catch { return {}; }
}

async function fetchExamplesBatch(words, onProgress) {
  const CONCURRENCY = 5;
  const results = {};
  let done = 0;
  const queue = [...words];
  const worker = async () => {
    while (queue.length) {
      const word = queue.shift();
      const found = await fetchRealExamples(word);
      if (found.length) results[word.trim().toLowerCase()] = found;
      done++;
      onProgress && onProgress(done, words.length);
    }
  };
  await Promise.all(Array.from({ length: Math.min(CONCURRENCY, words.length) }, worker));
  return results;
}

async function freeDictLookupBatch(words, onProgress) {
  const CONCURRENCY = 6;
  const results = {};
  let done = 0;
  const queue = [...words];
  const worker = async () => {
    while (queue.length) {
      const word = queue.shift();
      try {
        const found = await freeDictLookup(word);
        if (found) results[word.trim().toLowerCase()] = found;
      } catch { /* word just stays unfilled */ }
      done++;
      onProgress && onProgress(done, words.length);
    }
  };
  await Promise.all(Array.from({ length: Math.min(CONCURRENCY, words.length) }, worker));
  return results;
}

const PDF_MAX_PAGES = 250;
const PDF_VISION_MAX_PAGES = 20;

async function extractPdfText(file, onProgress) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pageCount = Math.min(pdf.numPages, PDF_MAX_PAGES);
  let full = "";
  let textPages = 0;
  for (let i = 1; i <= pageCount; i++) {
    onProgress && onProgress(i, pageCount);
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const pageText = content.items.map((it) => it.str).join(" ");
    if (pageText.trim().length > 20) textPages++;
    full += pageText + "\n";
    page.cleanup && page.cleanup();
  }
  const looksScanned = pageCount > 0 && textPages / pageCount < 0.4;
  return { text: full, truncated: pdf.numPages > PDF_MAX_PAGES, totalPages: pdf.numPages, pageCount, looksScanned };
}

async function renderPdfPagesToImages(file, pageCount, onProgress) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const n = Math.min(pdf.numPages, pageCount, PDF_VISION_MAX_PAGES);
  const images = [];
  for (let i = 1; i <= n; i++) {
    onProgress && onProgress(i, n);
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 1.6 });
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext("2d");
    await page.render({ canvasContext: ctx, viewport }).promise;
    const dataUrl = canvas.toDataURL("image/png");
    images.push(dataUrl.split(",")[1]);
    page.cleanup && page.cleanup();
  }
  return { images, truncatedPages: pdf.numPages > n };
}

async function extractWordsFromImages(images, apiKey, model, onProgress, provider = DEFAULT_PROVIDER) {
  const system = `You are looking at scanned or photographed pages from a vocabulary word list. Read all visible text in the image(s) and identify the actual vocabulary words being taught, along with their definitions where clearly visible. Ignore headers, page numbers, decorative elements, and instructions. Return ONLY valid JSON (no markdown, no preamble): an array of objects like [{"word": string, "def": string}]. "def" should be empty string if no definition is visible for that word. Do not invent definitions.`;
  const BATCH = 4;
  let all = [];
  let failedBatches = 0;
  let lastError = null;
  const batches = [];
  for (let i = 0; i < images.length; i += BATCH) batches.push(images.slice(i, i + BATCH));
  for (let b = 0; b < batches.length; b++) {
    onProgress && onProgress(b + 1, batches.length);
    if (b > 0) await sleep(400);
    try {
      const raw = await callAI({ provider, apiKey, model, system, userText: "Extract the vocabulary words and definitions visible in these page images.", images: batches[b], maxTokens: 4000 });
      const parsed = extractJsonArray(raw);
      if (Array.isArray(parsed)) all = all.concat(parsed);
    } catch (err) {
      failedBatches++;
      lastError = err.message;
    }
  }
  const seen = new Set();
  const deduped = [];
  for (const w of all) {
    const key = (w?.word || "").trim().toLowerCase();
    if (!key || seen.has(key)) continue;
    seen.add(key);
    deduped.push({ word: w.word.trim(), def: (w.def || "").trim() });
  }
  return { words: deduped, failedBatches, totalBatches: batches.length, lastError };
}

function extractJsonArray(raw) {
  const cleaned = raw.replace(/```json|```/g, "").trim();
  try { return JSON.parse(cleaned); } catch { /* fall through to bracket scan */ }
  const start = cleaned.indexOf("[");
  const end = cleaned.lastIndexOf("]");
  if (start === -1 || end === -1 || end <= start) throw new Error("No JSON array found in response");
  return JSON.parse(cleaned.slice(start, end + 1));
}

async function extractWordsWithAI(rawText, apiKey, model, onProgress, provider = DEFAULT_PROVIDER) {
  const CHUNK = 12000;
  const chunks = [];
  for (let i = 0; i < rawText.length; i += CHUNK) chunks.push(rawText.slice(i, i + CHUNK));
  const capped = chunks.slice(0, 25);
  const system = `You are extracting a clean vocabulary list from raw, possibly messy text (often pulled from a PDF word list). The text may mix real vocabulary words and their definitions together with noise: page numbers, headers, instructions, part-of-speech tags, example sentences, etc.
Identify ONLY the actual vocabulary words being taught. Return ONLY valid JSON (no markdown, no preamble): an array of objects like [{"word": string, "def": string}].
Rules:
- "word" must be a single real English word or short fixed phrase — no numbering, no page numbers, no stray punctuation.
- "def" is the definition if one is clearly present in the text near the word, kept to one short sentence; otherwise an empty string. Do not invent definitions that aren't in the text.
- Skip headers, instructions, page numbers, and anything that is not itself a vocabulary entry.
- If a chunk has no real vocabulary entries, return an empty array [].`;
  let all = [];
  let failedChunks = 0;
  let lastError = null;
  for (let i = 0; i < capped.length; i++) {
    onProgress && onProgress(i + 1, capped.length);
    if (i > 0) await sleep(providerThrottleMs(provider));
    try {
      const raw = await callAI({ provider, apiKey, model, system, userText: `Raw text:\n"""${capped[i]}"""`, maxTokens: 4000 });
      const parsed = extractJsonArray(raw);
      if (Array.isArray(parsed)) all = all.concat(parsed);
    } catch (err) {
      failedChunks++;
      lastError = err.message;
      // keep going — a single messy chunk shouldn't sink the whole import
    }
  }
  const seen = new Set();
  const deduped = [];
  for (const w of all) {
    const key = (w?.word || "").trim().toLowerCase();
    if (!key || seen.has(key)) continue;
    seen.add(key);
    deduped.push({ word: w.word.trim(), def: (w.def || "").trim() });
  }
  return { words: deduped, failedChunks, totalChunks: capped.length, truncated: chunks.length > capped.length, lastError };
}

async function suggestPlanWithAI(words, apiKey, model, provider = DEFAULT_PROVIDER) {
  const system = `You are a spaced-repetition learning coach. Given the size of a vocabulary list (and a sample of its words), recommend a sustainable daily study plan so a learner fully memorizes the whole list without burning out: how many brand-new words to introduce per day, and how many previously-learned words to review per day. Return ONLY valid JSON (no markdown, no preamble): {"newPerDay": number, "reviewPerDay": number, "estimatedDays": number, "rationale": string}. "rationale" is one short sentence (under 140 characters) explaining the pacing.`;
  const sample = words.slice(0, 25).map((w) => w.word).join(", ");
  const user = `Total words: ${words.length}. Sample: ${sample}${words.length > 25 ? ", …" : ""}.`;
  const raw = await callAI({ provider, apiKey, model, system, userText: user, maxTokens: 300 });
  return extractJsonArray(`[${raw.replace(/```json|```/g, "").trim()}]`)[0];
}

function WordLists({ lists, setLists, activeListId, setActiveListId, apiKey, model, provider }) {
  const [importText, setImportText] = useState("");
  const [importName, setImportName] = useState("");
  const [preview, setPreview] = useState(null);
  const [filling, setFilling] = useState(0);
  const [planDraft, setPlanDraft] = useState(null);
  const [planRationale, setPlanRationale] = useState(null);
  const [planLoading, setPlanLoading] = useState(false);
  const [planError, setPlanError] = useState(null);
  const [editingPlanId, setEditingPlanId] = useState(null);
  const [editPlanDraft, setEditPlanDraft] = useState(null);
  const [pdfLoading, setPdfLoading] = useState(false);
  const [pdfProgress, setPdfProgress] = useState(null);
  const [pdfError, setPdfError] = useState(null);
  const [aiParsing, setAiParsing] = useState(false);
  const [aiProgress, setAiProgress] = useState(null);
  const [aiError, setAiError] = useState(null);
  const [aiNotice, setAiNotice] = useState(null);
  const fileRef = useRef(null);

  const addOfficialList = (key) => {
    const src = OFFICIAL_LISTS[key];
    const words = src.words.map(freshWord);
    const plan = suggestPlan(words.length);
    const id = `${key}-${Date.now()}`;
    setLists((ls) => [...ls, { id, name: src.name, source: "official-key", officialKey: key, plan, createdAt: Date.now(), words }]);
    setActiveListId(id);
  };

  const parseImport = () => {
    const lines = importText.split("\n").map((l) => l.trim()).filter(Boolean);
    const words = lines.map((rawLine) => {
      const line = rawLine.replace(/^\s*[\d]+[\.\)]\s*/, "").replace(/\([^)]*\)/g, "").trim();
      const parts = line.split(/:|—|--|-{1}(?=\s)/);
      const word = (parts[0] || "").trim().replace(/[.,;]+$/, "");
      const def = parts.slice(1).join(":").trim();
      return freshWord({ word, def: def || "", vibe: "formal", coll: "" });
    }).filter((w) => w.word && /^[a-zA-Z][a-zA-Z\s-]*$/.test(w.word) && w.word.length <= 30);
    if (!words.length) return;
    setPreview(words);
    setPlanDraft(suggestPlan(words.length));
  };

  const runAiExtractOn = async (text) => {
    if (!apiKey || !text.trim()) return false;
    setAiParsing(true); setAiError(null); setAiNotice(null); setAiProgress(null);
    try {
      const { words: found, failedChunks, totalChunks, truncated, lastError } = await extractWordsWithAI(
        text, apiKey, model, (current, total) => setAiProgress({ current, total }), provider
      );
      if (!found.length) {
        setAiError(failedChunks
          ? `${PROVIDERS[provider].short} couldn't process that text — ${lastError || "the request kept failing"}. Try again in a moment, or use "Parse words" instead.`
          : `${PROVIDERS[provider].short} couldn't find any vocabulary words in that text — try pasting a cleaner excerpt.`);
        return false;
      }
      const words = found.map((w) => freshWord({ word: w.word, def: w.def, vibe: "formal", coll: "" }));
      setPreview(words);
      setPlanDraft(suggestPlan(words.length));
      if (failedChunks || truncated) {
        const bits = [];
        if (failedChunks) bits.push(`${failedChunks} of ${totalChunks} section${totalChunks === 1  ? "" : "s"} failed and were skipped`);
        if (truncated) bits.push("only the first portion of this very large text was analyzed");
        setAiNotice(`Found ${found.length} words, but ${bits.join("; ")} — review the list below before creating it.`);
      }
      return true;
    } catch (err) {
      setAiError(err.message || "AI extraction failed.");
      return false;
    } finally {
      setAiParsing(false); setAiProgress(null);
    }
  };

  const runAiExtract = () => runAiExtractOn(importText);

  const runAiExtractFromImages = async (images) => {
    if (!apiKey || !images.length) return false;
    setAiParsing(true); setAiError(null); setAiNotice(null); setAiProgress(null);
    try {
      const { words: found, failedBatches, totalBatches, lastError } = await extractWordsFromImages(
        images, apiKey, model, (current, total) => setAiProgress({ current, total }), provider
      );
      if (!found.length) {
        setAiError(failedBatches
          ? `${PROVIDERS[provider].short} couldn't read those page images — ${lastError || "the request kept failing"}. Try again in a moment.`
          : `${PROVIDERS[provider].short} couldn't make out any vocabulary words in those page images — try a clearer scan or paste the words manually.`);
        return false;
      }
      const words = found.map((w) => freshWord({ word: w.word, def: w.def, vibe: "formal", coll: "" }));
      setPreview(words);
      setPlanDraft(suggestPlan(words.length));
      if (failedBatches) {
        setAiNotice(`Found ${found.length} words, but ${failedBatches} of ${totalBatches} page batch${totalBatches === 1 ? "" : "es"} couldn't be read — review the list below before creating it.`);
      }
      return true;
    } catch (err) {
      setAiError(err.message || "AI image scan failed.");
      return false;
    } finally {
      setAiParsing(false); setAiProgress(null);
    }
  };

  const handlePdfUpload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setPdfLoading(true); setPdfError(null);
    try {
      const { text, truncated, totalPages, pageCount, looksScanned } = await extractPdfText(file, (current, total) => setPdfProgress({ current, total }));

      if (!text.trim() || looksScanned) {
        if (!apiKey) {
          setPdfError(!text.trim()
            ? `This PDF doesn't contain selectable text — it looks like a scanned or photographed document. Add an API key in Settings so ${PROVIDERS[provider].short} can read the page images directly.`
            : `Most of this PDF's pages don't have selectable text — it looks partly scanned. Add an API key in Settings so ${PROVIDERS[provider].short} can read the page images directly.`);
          setPdfLoading(false);
          return;
        }
        setPdfLoading(false);
        const { images, truncatedPages } = await renderPdfPagesToImages(file, pageCount, (current, total) => setPdfProgress({ current, total }));
        if (truncatedPages) setAiNotice(`This scanned PDF has more pages than we can process visually — only the first ${images.length} were scanned.`);
        await runAiExtractFromImages(images);
        return;
      }

      setImportText((t) => (t ? t + "\n" : "") + text);
      if (truncated) setPdfError(`This PDF has ${totalPages} pages — only the first ${PDF_MAX_PAGES} were read to keep things fast. Add the rest manually if you need it.`);
      setPdfLoading(false);
      if (apiKey) {
        await runAiExtractOn(text);
      }
    } catch (err) {
      setPdfError("Couldn't read that PDF — it may be corrupted, password-protected, or too large for the browser to process. Try a different file or paste the words manually.");
      setPdfLoading(false);
    } finally {
      setPdfLoading(false); setPdfProgress(null);
      if (fileRef.current) fileRef.current.value = "";
    }
  };

  const fillMissingDefs = async () => {
    if (!preview) return;
    const missing = preview.filter((w) => !w.def);
    if (!missing.length) return;
    setFilling({ current: 0, total: 1, phase: "dictionary" });
    try {
      // Phase 1: free dictionary lookup, no key needed — covers most real words.
      const freeResults = await freeDictLookupBatch(
        missing.map((w) => w.word),
        (current, total) => setFilling({ current, total, phase: "dictionary" })
      );
      let next = preview.map((w) => {
        if (w.def) return w;
        const found = freeResults[w.word.trim().toLowerCase()];
        return found ? { ...w, def: found.def } : w;
      });
      setPreview(next);

      // Phase 2: AI fills whatever the free dictionary didn't recognize (rare/technical words, typos).
      const stillMissing = next.filter((w) => !w.def);
      if (apiKey && stillMissing.length) {
        const aiResults = await fetchDefinitionsBatch(
          stillMissing.map((w) => w.word), apiKey, model, provider,
          (current, total) => setFilling({ current, total, phase: "ai" })
        );
        next = next.map((w) => {
          if (w.def) return w;
          const match = aiResults[w.word.trim().toLowerCase()];
          return match ? { ...w, def: match.def || "", vibe: match.vibe || w.vibe, coll: match.coll || w.coll } : w;
        });
        setPreview(next);
      }
    } finally {
      setFilling(0);
    }
  };

  const createImportedList = () => {
    if (!preview || !preview.length) return;
    const id = `custom-${Date.now()}`;
    const name = importName.trim() || `Imported list (${preview.length})`;
    setLists((ls) => [...ls, { id, name, source: "custom", plan: planDraft, createdAt: Date.now(), words: preview }]);
    setActiveListId(id);
    setImportText(""); setImportName(""); setPreview(null); setPlanDraft(null); setPlanRationale(null);
  };

  const optimizePlanWithAI = async () => {
    if (!apiKey || !preview) return;
    setPlanLoading(true); setPlanError(null);
    try {
      const suggestion = await suggestPlanWithAI(preview, apiKey, model, provider);
      if (suggestion && Number.isFinite(suggestion.newPerDay)) {
        setPlanDraft({ newPerDay: Math.max(1, Math.round(suggestion.newPerDay)), reviewPerDay: Math.max(1, Math.round(suggestion.reviewPerDay || suggestion.newPerDay * 2)) });
        setPlanRationale(suggestion.rationale || null);
      }
    } catch (err) {
      setPlanError(err.message || "Couldn't get an AI plan right now — the manual pacing above still works fine.");
    } finally {
      setPlanLoading(false);
    }
  };

  const startEditPlan = (list) => {
    setEditingPlanId(list.id);
    setEditPlanDraft(list.plan || suggestPlan(list.words.length) || { newPerDay: 5, reviewPerDay: 10 });
  };

  const savePlanEdit = (listId) => {
    setLists((ls) => ls.map((l) => (l.id === listId ? { ...l, plan: editPlanDraft } : l)));
    setEditingPlanId(null); setEditPlanDraft(null);
  };

  const optimizeExistingPlanWithAI = async (list) => {
    if (!apiKey) return;
    setPlanLoading(true); setPlanError(null);
    try {
      const suggestion = await suggestPlanWithAI(list.words, apiKey, model, provider);
      if (suggestion && Number.isFinite(suggestion.newPerDay)) {
        setEditPlanDraft({ newPerDay: Math.max(1, Math.round(suggestion.newPerDay)), reviewPerDay: Math.max(1, Math.round(suggestion.reviewPerDay || suggestion.newPerDay * 2)) });
        setPlanRationale(suggestion.rationale || null);
      }
    } catch (err) {
      setPlanError(err.message || "Couldn't get an AI plan right now.");
    } finally {
      setPlanLoading(false);
    }
  };

  const removeList = (id) => {
    if (lists.length <= 1) return;
    setLists((ls) => ls.filter((l) => l.id !== id));
  };

  return (
    <div className="max-w-4xl mx-auto px-4 sm:px-8 py-6 sm:py-10 space-y-10">
      <header>
        <p className="text-xs uppercase tracking-[0.2em] text-[color:var(--accent-text)] mb-1">库 · Word Lists</p>
        <h2 className="text-2xl font-semibold text-[color:var(--text)]">Choose what to study</h2>
      </header>

      <section>
        <h3 className="text-sm font-semibold text-[color:var(--text)] mb-3">Official word lists</h3>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
          {Object.entries(OFFICIAL_LISTS).map(([key, l]) => (
            <div key={key} className="rounded-xl bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] p-5">
              <p className="text-sm font-semibold text-[color:var(--text)]">{l.name}</p>
              <p className="text-xs text-[color:var(--text-faint)] mt-1">{l.words.length} words</p>
              <button onClick={() => addOfficialList(key)}
                className="mt-4 w-full flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg bg-accent-500 text-[#0a0e14] text-xs font-semibold hover:bg-accent-400 transition">
                <Plus size={13} /> Add to my lists
              </button>
            </div>
          ))}
        </div>
      </section>

      <section>
        <h3 className="text-sm font-semibold text-[color:var(--text)] mb-3">Import your own words</h3>
        <div className="rounded-xl bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] p-6 space-y-4">
          {!preview ? (
            <>
              <p className="text-xs text-[color:var(--text-dim)]">One word per line. Optionally add a definition after a colon or dash — e.g. <span className="font-mono">mitigate: to make less severe</span>.</p>
              <textarea value={importText} onChange={(e) => setImportText(e.target.value)} rows={6}
                placeholder={"serendipity\nresilient: able to recover quickly\nobfuscate - to make unclear"}
                className="w-full bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] rounded-lg px-3 py-2 text-sm text-[color:var(--text)] focus:outline-none focus:ring-accent-500/50 font-mono resize-none" />
              <div className="flex items-center gap-3 flex-wrap">
                <button onClick={parseImport} disabled={!importText.trim()}
                  className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] text-[color:var(--text)] text-sm font-medium hover:ring-accent-500/40 disabled:opacity-40 transition">
                  <Upload size={14} /> Parse words (fast)
                </button>
                <button onClick={runAiExtract} disabled={!importText.trim() || !apiKey || aiParsing}
                  className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-accent-500 text-[#0a0e14] text-sm font-semibold hover:bg-accent-400 disabled:opacity-40 transition">
                  {aiParsing ? <Loader2 size={14} className="animate-spin" /> : <Sparkles size={14} />}
                  {aiParsing ? `Analyzing${aiProgress ? ` ${aiProgress.current}/${aiProgress.total}` : ""}…` : `Analyze with ${PROVIDERS[provider].short}`}
                </button>
                <span className="text-xs text-[color:var(--text-faint)]">or</span>
                <input ref={fileRef} type="file" accept="application/pdf" className="hidden" onChange={handlePdfUpload} />
                <button onClick={() => fileRef.current?.click()} disabled={pdfLoading || aiParsing}
                  className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] text-[color:var(--text)] text-sm font-medium hover:ring-accent-500/40 disabled:opacity-50 transition">
                  {(pdfLoading || aiParsing) ? <Loader2 size={14} className="animate-spin" /> : <FileText size={14} />}
                  {pdfLoading ? `Reading PDF${pdfProgress ? ` (page ${pdfProgress.current}/${pdfProgress.total})` : ""}…`
                    : aiParsing ? `Scanning for vocab${aiProgress ? ` ${aiProgress.current}/${aiProgress.total}` : ""}…`

              </div>
              {pdfError && <p className="text-[11px] text-rose-700 dark:text-rose-300">{pdfError}</p>}
              {aiError && <p className="text-[11px] text-rose-700 dark:text-rose-300">{aiError}</p>}

                {apiKey ? ` PDFs are scanned by ${PROVIDERS[provider].short} automatically after upload — even scanned/photographed pages with no selectable text, since it reads the page images directly.` : " Add an API key in Settings and PDFs will be scanned automatically after upload, including scanned/photographed pages with no selectable text."}
              </p>

              </div>
              <input value={importName} onChange={(e) => setImportName(e.target.value)} placeholder="List name (optional)"
                className="w-full bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] rounded-lg px-3 py-2 text-sm text-[color:var(--text)] focus:outline-none focus:ring-accent-500/50" />

              {preview.some((w) => !w.def) && (
                <div className="flex items-center justify-between rounded-lg bg-accent-500/5 ring-1 ring-accent-500/20 px-4 py-2.5">
                  <p className="text-xs text-[color:var(--text-dim)]">{preview.filter((w) => !w.def).length} word(s) missing a definition.</p>
                  <button onClick={fillMissingDefs} disabled={!!filling}
                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-accent-500 text-[#0a0e14] text-xs font-semibold hover:bg-accent-400 disabled:opacity-40 transition shrink-0">
                    {filling ? <Loader2 size={13} className="animate-spin" /> : <Sparkles size={13} />}
                    {filling
                      ? (filling.phase === "ai" ? `Asking ${PROVIDERS[provider].short} for the rest…` : filling.total > 1 ? `Looking up ${filling.current}/${filling.total}…` : "Looking up definitions…")
                      : "Auto-fill definitions"}
                  </button>
                </div>
              )}

              <div className="max-h-40 overflow-y-auto space-y-1.5">
                {preview.map((w, i) => (
                  <div key={i} className="flex items-center gap-2 text-xs px-3 py-1.5 rounded-lg bg-[color:var(--surface2)]">
                    <span className="font-medium text-[color:var(--text)]">{w.word}</span>
                    <span className="text-[color:var(--text-faint)] truncate">{w.def || "(no definition yet)"}</span>
                  </div>
                ))}
              </div>

              <div className="rounded-lg bg-sky-500/5 ring-1 ring-sky-500/20 px-4 py-3">
                {planDraft ? (
                  <>
                    <p className="text-xs text-sky-800 dark:text-sky-200 mb-2">That's a lot of words — here's a suggested daily pace so you don't burn out:</p>
                    <div className="flex gap-4">
                      <label className="flex-1 text-xs text-[color:var(--text-dim)]">New words / day
                        <input type="number" min={1} value={planDraft.newPerDay}
                          onChange={(e) => setPlanDraft({ ...planDraft, newPerDay: +e.target.value || 1 })}
                          className="mt-1 w-full bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] rounded-lg px-2 py-1.5 text-[color:var(--text)]" />
                      </label>
                      <label className="flex-1 text-xs text-[color:var(--text-dim)]">Reviews / day
                        <input type="number" min={1} value={planDraft.reviewPerDay}
                          onChange={(e) => setPlanDraft({ ...planDraft, reviewPerDay: +e.target.value || 1 })}
                          className="mt-1 w-full bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] rounded-lg px-2 py-1.5 text-[color:var(--text)]" />
                      </label>
                    </div>
                    {planRationale && <p className="text-[11px] text-sky-700 dark:text-sky-300 mt-2 italic">"{planRationale}"</p>}
                    {planError && <p className="text-[11px] text-rose-700 dark:text-rose-300 mt-2">{planError}</p>}
                    <div className="flex items-center gap-3 mt-2">
                      <button onClick={() => setPlanDraft(null)} className="text-[11px] text-[color:var(--text-faint)] hover:text-[color:var(--text)]">Skip pacing — study them all at once</button>
                      {apiKey && (
                        <button onClick={optimizePlanWithAI} disabled={planLoading}
                          className="flex items-center gap-1 text-[11px] text-sky-700 dark:text-sky-300 hover:underline disabled:opacity-50">
                          {planLoading ? <Loader2 size={11} className="animate-spin" /> : <Sparkles size={11} />}
                          {planLoading ? "Optimizing…" : `Let ${PROVIDERS[provider].short} optimize this plan`}
                        </button>
                      )}
                    </div>
                  </>
                ) : (
                  <div className="flex items-center justify-between">
                    <p className="text-xs text-sky-800 dark:text-sky-200">Small enough to learn in one sitting — no pacing needed.</p>
                    {preview.length > 10 && <button onClick={() => setPlanDraft(suggestPlan(preview.length))} className="text-[11px] text-sky-700 dark:text-sky-300 hover:underline">Add a daily plan anyway</button>}
                  </div>
                )}
              </div>

              <button onClick={createImportedList}
                className="w-full flex items-center justify-center gap-1.5 px-3.5 py-2.5 rounded-lg bg-accent-500 text-[#0a0e14] text-sm font-semibold hover:bg-accent-400 transition">
                <Check size={15} /> Create list
              </button>
            </>
          )}
        </div>
      </section>

      <section>
        <h3 className="text-sm font-semibold text-[color:var(--text)] mb-3">My lists</h3>
        <div className="space-y-2">
          {lists.map((l) => {
            const mastered = l.words.filter((w) => w.box >= 5).length;
            const active = l.id === activeListId;
            const editing = editingPlanId === l.id;
            return (
              <div key={l.id} className={`rounded-xl ring-1 transition ${
                active ? "bg-accent-500/10 ring-accent-500/40" : "bg-[color:var(--surface)] ring-[color:var(--border)]"}`}>
                <div className="flex items-center gap-4 px-5 py-4">
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-semibold text-[color:var(--text)]">{l.name} {active && <span className="text-[10px] uppercase tracking-wide text-[color:var(--accent-text)] ml-1">studying</span>}</p>
                    <p className="text-xs text-[color:var(--text-faint)] mt-0.5">
                      {l.words.length} words · {mastered} mastered {l.plan ? `· plan: ${l.plan.newPerDay} new / ${l.plan.reviewPerDay} review per day` : "· no daily plan"}
                    </p>
                  </div>
                  <button onClick={() => (editing ? (setEditingPlanId(null), setEditPlanDraft(null)) : startEditPlan(l))}
                    className="px-3 py-1.5 rounded-lg text-xs font-medium bg-[color:var(--surface2)] text-[color:var(--text-dim)] hover:text-[color:var(--text)] ring-1 ring-[color:var(--border)]">
                    {editing ? "Close" : "Edit plan"}
                  </button>
                  {!active && <button onClick={() => setActiveListId(l.id)} className="px-3 py-1.5 rounded-lg text-xs font-medium bg-[color:var(--surface2)] text-[color:var(--text-dim)] hover:text-[color:var(--text)] ring-1 ring-[color:var(--border)]">Study this</button>}
                  {lists.length > 1 && <button onClick={() => removeList(l.id)} className="text-[color:var(--text-faint)] hover:text-rose-500 p-1"><Trash2 size={15} /></button>}
                </div>
                {editing && editPlanDraft && (
                  <div className="px-5 pb-4">
                    <div className="rounded-lg bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] p-4">
                      <div className="flex gap-4 mb-2">
                        <label className="flex-1 text-xs text-[color:var(--text-dim)]">New words / day
                          <input type="number" min={1} value={editPlanDraft.newPerDay}
                            onChange={(e) => setEditPlanDraft({ ...editPlanDraft, newPerDay: +e.target.value || 1 })}
                            className="mt-1 w-full bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] rounded-lg px-2 py-1.5 text-[color:var(--text)]" />
                        </label>
                        <label className="flex-1 text-xs text-[color:var(--text-dim)]">Reviews / day
                          <input type="number" min={1} value={editPlanDraft.reviewPerDay}
                            onChange={(e) => setEditPlanDraft({ ...editPlanDraft, reviewPerDay: +e.target.value || 1 })}
                            className="mt-1 w-full bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] rounded-lg px-2 py-1.5 text-[color:var(--text)]" />
                        </label>
                      </div>
                      {planRationale && <p className="text-[11px] text-sky-700 dark:text-sky-300 mb-2 italic">"{planRationale}"</p>}
                      {planError && <p className="text-[11px] text-rose-700 dark:text-rose-300 mb-2">{planError}</p>}
                      <div className="flex items-center justify-between">
                        {apiKey ? (
                          <button onClick={() => optimizeExistingPlanWithAI(l)} disabled={planLoading}
                            className="flex items-center gap-1 text-[11px] text-sky-700 dark:text-sky-300 hover:underline disabled:opacity-50">
                            {planLoading ? <Loader2 size={11} className="animate-spin" /> : <Sparkles size={11} />}
                            {planLoading ? "Optimizing…" : `Let ${PROVIDERS[provider].short} optimize this plan`}
                          </button>
                        ) : <span />}
                        <div className="flex gap-2">
                          <button onClick={() => setEditPlanDraft(null)} className="text-[11px] text-[color:var(--text-faint)] hover:text-[color:var(--text)] px-2">No plan (study all at once)</button>
                          <button onClick={() => savePlanEdit(l.id)}
                            className="px-3 py-1.5 rounded-lg bg-accent-500 text-[#0a0e14] text-xs font-semibold hover:bg-accent-400">Save</button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
                {editing && !editPlanDraft && (
                  <div className="px-5 pb-4 flex items-center justify-between">
                    <p className="text-xs text-[color:var(--text-faint)]">No daily plan — this list is studied all at once.</p>
                    <div className="flex gap-2">
                      <button onClick={() => setEditPlanDraft(suggestPlan(l.words.length) || { newPerDay: 5, reviewPerDay: 10 })}
                        className="text-[11px] text-sky-700 dark:text-sky-300 hover:underline">Add a daily plan</button>
                      <button onClick={() => savePlanEdit(l.id)}
                        className="px-3 py-1.5 rounded-lg bg-accent-500 text-[#0a0e14] text-xs font-semibold hover:bg-accent-400">Save</button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </section>
    </div>
  );
}

/* ---------------- Vocab Deck ---------------- */
function Deck({ list, lists, activeListId, setActiveListId, updateList, onOpen, apiKey, model, provider }) {
  const empty = { word: "", def: "", vibe: "formal", coll: "" };
  const [form, setForm] = useState(empty);
  const [open, setOpen] = useState(false);
  const [focusMode, setFocusMode] = useState(false);
  const [looking, setLooking] = useState(false);
  const [lookupErr, setLookupErr] = useState(null);

  const lookup = async () => {
    const word = form.word.trim();
    if (!word) return;
    setLooking(true); setLookupErr(null);
    try {
      const free = await freeDictLookup(word).catch(() => null);
      if (free) setForm((f) => ({ ...f, def: f.def || free.def }));
      if (apiKey) {
        const parsed = await fetchDefinition(word, apiKey, model, provider);
        setForm((f) => ({ ...f, def: f.def || parsed.def || "", vibe: parsed.vibe || f.vibe, coll: parsed.coll || f.coll }));
      } else if (!free) {
        setLookupErr("Couldn't find that word in the free dictionary — add an API key in Settings for AI lookup instead.");
      }
    } catch (err) {
      setLookupErr(err.message || "Lookup failed.");
    } finally {
      setLooking(false);
    }
  };

  const add = () => {
    if (!form.word.trim() || !form.def.trim()) return;
    updateList(list.id, (l) => ({ ...l, words: [freshWord({ ...form, id: Date.now() }), ...l.words] }));
    setForm(empty); setOpen(false); setFocusMode(false); setLookupErr(null);
  };

  const addAndContinue = () => {
    if (!form.word.trim() || !form.def.trim()) return;
    updateList(list.id, (l) => ({ ...l, words: [freshWord({ ...form, id: Date.now() }), ...l.words] }));
    setForm(empty); setLookupErr(null);
  };
  const remove = (id) => updateList(list.id, (l) => ({ ...l, words: l.words.filter((w) => w.id !== id) }));

  const vibeColor = (v) => ({
    formal: "text-sky-700 dark:text-sky-100 bg-sky-500/15 dark:bg-sky-500/20",
    academic: "text-violet-700 dark:text-violet-100 bg-violet-500/15 dark:bg-violet-500/20",
    casual: "text-amber-700 dark:text-amber-100 bg-amber-500/15 dark:bg-amber-500/20",
    literary: "text-rose-700 dark:text-rose-100 bg-rose-500/15 dark:bg-rose-500/20",
  }[v] || "text-slate-700 dark:text-slate-100 bg-slate-500/15 dark:bg-slate-500/20");

  const boxLabel = (w) => (!w.seen ? "new" : w.box >= 5 ? "mastered" : `box ${w.box}`);

  return (
    <div className="max-w-4xl mx-auto px-4 sm:px-8 py-6 sm:py-10">
      <header className="flex items-end justify-between mb-8">
        <div>
          <p className="text-xs uppercase tracking-[0.2em] text-[color:var(--accent-text)] mb-1">背 · Vocab Deck</p>
          <h2 className="text-2xl font-semibold text-[color:var(--text)]">Target words</h2>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={() => setFocusMode(true)} title="Focus mode — add words full screen"
            className="flex items-center gap-1.5 px-3 sm:px-3.5 py-2 rounded-lg bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] text-[color:var(--text)] text-sm font-medium hover:ring-accent-500/40 transition">
            <Expand size={15} /> <span className="hidden sm:inline">Focus mode</span>
          </button>
          <button onClick={() => setOpen((o) => !o)}
            className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-accent-500 text-[#0a0e14] text-sm font-medium hover:bg-accent-400 transition">
            <Plus size={16} /> Add word
          </button>
        </div>
      </header>

      {lists.length > 1 && (
        <div className="mb-6 flex items-center gap-2">
          <span className="text-xs text-[color:var(--text-faint)]">Studying:</span>
          <select value={activeListId} onChange={(e) => setActiveListId(e.target.value)}
            className="bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] rounded-lg px-3 py-1.5 text-sm text-[color:var(--text)] focus:outline-none">
            {lists.map((l) => <option key={l.id} value={l.id}>{l.name}</option>)}
          </select>
        </div>
      )}

      {open && (
        <div className="rounded-xl bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] p-6 mb-6 space-y-4">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label className="block text-xs text-[color:var(--text-dim)] mb-1.5">Word</label>
              <input value={form.word} onChange={(e) => setForm({ ...form, word: e.target.value })}
                className="w-full bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] rounded-lg px-3 py-2 text-sm text-[color:var(--text)] focus:outline-none focus:ring-accent-500/50" />
            </div>
            <div>
              <label className="block text-xs text-[color:var(--text-dim)] mb-1.5">Tone / Vibe</label>
              <select value={form.vibe} onChange={(e) => setForm({ ...form, vibe: e.target.value })}
                className="w-full bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] rounded-lg px-3 py-2 text-sm text-[color:var(--text)] focus:outline-none focus:ring-accent-500/50">
                {["formal", "academic", "casual", "literary"].map((v) => <option key={v}>{v}</option>)}
              </select>
            </div>
          </div>

          <div className="flex items-center justify-between rounded-lg bg-accent-500/5 ring-1 ring-accent-500/20 px-4 py-2.5">
            <p className="text-xs text-[color:var(--text-dim)]">Type a word, then look up its definition{apiKey ? `, vibe & collocations via ${PROVIDERS[provider].short}` : " (free, no API key needed)"}.</p>
            <button onClick={lookup} disabled={looking || !form.word.trim()}
              className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-accent-500 text-[#0a0e14] text-xs font-semibold hover:bg-accent-400 disabled:opacity-40 disabled:cursor-not-allowed transition shrink-0">
              {looking ? <Loader2 size={13} className="animate-spin" /> : <Sparkles size={13} />}
              {looking ? "Searching…" : "Auto-fill"}
            </button>
          </div>
          {lookupErr && <p className="text-[11px] text-rose-700 dark:text-rose-300 -mt-1">{lookupErr}</p>}

          <div>
            <label className="block text-xs text-[color:var(--text-dim)] mb-1.5">Definition</label>
            <textarea value={form.def} onChange={(e) => setForm({ ...form, def: e.target.value })} rows={2}
              placeholder="Write it yourself, or auto-fill above."
              className="w-full bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] rounded-lg px-3 py-2 text-sm text-[color:var(--text)] focus:outline-none focus:ring-accent-500/50 resize-none" />
          </div>
          <div>
            <label className="block text-xs text-[color:var(--text-dim)] mb-1.5">Core collocations</label>
            <input value={form.coll} onChange={(e) => setForm({ ...form, coll: e.target.value })}
              placeholder="e.g. mitigate risk, mitigate the impact"
              className="w-full bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] rounded-lg px-3 py-2 text-sm text-[color:var(--text)] focus:outline-none focus:ring-accent-500/50" />
          </div>
          <div className="flex gap-2 justify-end">
            <button onClick={() => { setOpen(false); setForm(empty); setLookupErr(null); }}
              className="px-4 py-2 rounded-lg text-sm text-[color:var(--text-dim)] hover:text-[color:var(--text)]">Cancel</button>
            <button onClick={add}
              className="px-4 py-2 rounded-lg bg-accent-500 text-[#0a0e14] text-sm font-medium hover:bg-accent-400">Save word</button>
          </div>
        </div>
      )}

      <div className="space-y-2 stagger">
        {list.words.map((w) => (
          <div key={w.id} onClick={() => onOpen(w)}
            className="group flex items-center gap-4 rounded-xl bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] px-5 py-4 hover:ring-accent-500/40 hover:-translate-y-0.5 cursor-pointer transition-all duration-200">
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2.5 mb-1">
                <span className="text-base font-semibold text-[color:var(--text)]">{w.word}</span>
                <AudioPronunciationButton word={w.word} size={13} />
                <span className={`text-[10px] uppercase tracking-wide px-2 py-0.5 rounded-full ${vibeColor(w.vibe)}`}>{w.vibe}</span>
                <span className="text-[10px] uppercase tracking-wide px-2 py-0.5 rounded-full bg-[color:var(--surface2)] text-[color:var(--text-faint)]">{boxLabel(w)}</span>
              </div>
              <p className="text-sm text-[color:var(--text-dim)] truncate">{w.def || "(no definition yet)"}</p>
            </div>
            <button onClick={(e) => { e.stopPropagation(); remove(w.id); }}
              className="opacity-0 group-hover:opacity-100 text-[color:var(--text-faint)] hover:text-rose-500 transition p-1">
              <Trash2 size={16} />
            </button>
            <ChevronRight size={16} className="text-[color:var(--text-faint)] group-hover:text-[color:var(--accent-text)] transition" />
          </div>
        ))}
        {list.words.length === 0 && <p className="text-center text-sm text-[color:var(--text-dim)] py-12">No words yet. Add your first target word above.</p>}
      </div>

      {focusMode && (
        <div className="fixed inset-0 z-50 bg-[color:var(--bg)] overflow-y-auto animate-fade-in">
          <div className="max-w-2xl mx-auto px-6 py-10 min-h-screen flex flex-col">
            <div className="flex items-center justify-between mb-10">
              <p className="text-xs uppercase tracking-[0.2em] text-[color:var(--accent-text)]">背 · Focus mode</p>
              <button onClick={() => { setFocusMode(false); setOpen(false); setForm(empty); setLookupErr(null); }}
                className="p-2 rounded-lg text-[color:var(--text-faint)] hover:text-[color:var(--text)] hover:bg-white/5 transition">
                <X size={22} />
              </button>
            </div>

            <input value={form.word} onChange={(e) => setForm({ ...form, word: e.target.value })}
              autoFocus placeholder="Type a word…"
              className="w-full bg-transparent text-5xl sm:text-6xl font-bold text-[color:var(--text)] placeholder:text-[color:var(--text-faint)]/40 focus:outline-none mb-8" />

            <div className="flex items-center gap-3 mb-8 flex-wrap">
              <select value={form.vibe} onChange={(e) => setForm({ ...form, vibe: e.target.value })}
                className="bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] rounded-lg px-3 py-2 text-sm text-[color:var(--text)] focus:outline-none focus:ring-accent-500/50">
                {["formal", "academic", "casual", "literary"].map((v) => <option key={v}>{v}</option>)}
              </select>
              <button onClick={lookup} disabled={looking || !form.word.trim()}
                className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-accent-500 text-[#0a0e14] text-sm font-semibold hover:bg-accent-400 disabled:opacity-40 disabled:cursor-not-allowed transition">
                {looking ? <Loader2 size={14} className="animate-spin" /> : <Sparkles size={14} />}
                {looking ? "Searching…" : "Auto-fill"}
              </button>
              {lookupErr && <p className="text-xs text-rose-700 dark:text-rose-300">{lookupErr}</p>}
            </div>

            <textarea value={form.def} onChange={(e) => setForm({ ...form, def: e.target.value })} rows={3}
              placeholder="Write the definition here — as much room as you need."
              className="w-full bg-transparent text-xl sm:text-2xl leading-relaxed text-[color:var(--text)] placeholder:text-[color:var(--text-faint)] focus:outline-none resize-none mb-6" />

            <input value={form.coll} onChange={(e) => setForm({ ...form, coll: e.target.value })}
              placeholder="Core collocations, comma-separated…"
              className="w-full bg-transparent text-base text-[color:var(--text-dim)] placeholder:text-[color:var(--text-faint)] focus:outline-none mb-10 border-b border-[color:var(--border)] pb-3" />

            <div className="mt-auto flex items-center justify-end gap-3 pt-6">
              <button onClick={addAndContinue} disabled={!form.word.trim() || !form.def.trim()}
                className="px-5 py-3 rounded-lg ring-1 ring-[color:var(--border)] text-[color:var(--text)] text-sm font-medium hover:ring-accent-500/40 disabled:opacity-40 transition">
                Save & add another
              </button>
              <button onClick={add} disabled={!form.word.trim() || !form.def.trim()}
                className="px-6 py-3 rounded-lg bg-accent-500 text-[#0a0e14] text-sm font-semibold hover:bg-accent-400 disabled:opacity-40 transition">
                Save & close
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------- Word Detail Page (full page) ---------------- */
function WordDetailPage({ listId, wordId, lists, onBack }) {
  const list = lists.find((l) => l.id === listId);
  const word = list?.words.find((w) => w.id === wordId);

  if (!word) {
    return (
      <div className="max-w-2xl mx-auto px-4 sm:px-8 py-10 sm:py-16 text-center">
        <p className="text-sm text-[color:var(--text-dim)] mb-4">That word couldn't be found.</p>
        <button onClick={onBack} className="px-4 py-2 rounded-lg bg-accent-500 text-[#0a0e14] text-sm font-medium hover:bg-accent-400">Go back</button>
      </div>
    );
  }

  const coll = (word.coll || "").split(",").map((c) => c.trim()).filter(Boolean);
  const examples = buildExamples(word);
  const boxLabel = !word.seen ? "New — not studied yet" : word.box >= 5 ? "Mastered" : `Box ${word.box} of 6`;

  return (
    <div className="max-w-3xl mx-auto px-4 sm:px-8 py-6 sm:py-10">
      <button onClick={onBack} className="text-xs text-[color:var(--text-dim)] hover:text-[color:var(--text)] flex items-center gap-1 mb-6">
        <ArrowLeft size={13} /> Back
      </button>

      <div className="text-center mb-10">
        <span className="text-3xl">{VIBE_EMOJI[word.vibe] || "✨"}</span>
        <p className="text-xs uppercase tracking-widest text-[color:var(--accent-text)] mt-2">{word.vibe}</p>

        <p className="text-xs text-[color:var(--text-faint)] mb-4">Hint: {word.def}</p>

function MemorizeSession({ list, pool, updateList, setStats, registerActivity, onOpenDetail, onExit, setView }) {
  const [subPhase, setSubPhase] = useState("session");
  const [data, setData] = useState(() => {
    const obj = {};
    pool.forEach((w) => { obj[w.id] = { memRate: w.memRate || 0, memStarted: !!w.memStarted, done: (w.memRate || 0) >= 100 }; });
    return obj;
  });
  const pick = (avoidId, snapshot) => {
    const remaining = pool.filter((w) => !snapshot[w.id].done);
    if (!remaining.length) return null;
    const candidates = remaining.length > 1 ? remaining.filter((w) => w.id !== avoidId) : remaining;
    const source = candidates.length ? candidates : remaining;
    const weights = source.map((w) => Math.max(5, 100 - snapshot[w.id].memRate));
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < source.length; i++) {
      r -= weights[i];
      if (r <= 0) return source[i].id;
    }
    return source[source.length - 1].id;
  };
  const [currentId, setCurrentId] = useState(() => pick(null, data));
  const [showDetails, setShowDetails] = useState(false);

  const finishSession = (finalData) => {
    const today = todayStr();
    let newlyIntroduced = 0;
    updateList(list.id, (l) => ({
      ...l,
      words: l.words.map((w) => {
        const d = finalData[w.id];
        if (!d) return w;
        if (!w.seen) newlyIntroduced++;
        const boxBump = Math.min(6, (w.box || 0) + 1);
        return { ...w, seen: true, learnedOn: w.learnedOn || today, box: boxBump,
          due: addDays(today, LEITNER_DAYS[Math.min(boxBump, LEITNER_DAYS.length - 1)]), memRate: 100, memStarted: true };
      }),
    }));
    if (newlyIntroduced > 0) {
      setStats((s) => ({ ...s, dailyLearned: { ...(s.dailyLearned || {}), [today]: ((s.dailyLearned || {})[today] || 0) + newlyIntroduced } }));
    }
    registerActivity();
    setSubPhase("summary");
  };

  const rate = (rating) => {
    const cur = data[currentId];
    let nextRate;
    if (!cur.memStarted) {
      nextRate = rating === "know" ? 100 : rating === "blurry" ? 20 : 0;
    } else {
      nextRate = rating === "know" ? Math.min(100, cur.memRate + 20) : rating === "blurry" ? Math.min(100, cur.memRate + 10) : cur.memRate;
    }
    const updated = { ...data, [currentId]: { memRate: nextRate, memStarted: true, done: nextRate >= 100 } };
    setData(updated);
    setShowDetails(false);
    const nextId = pick(currentId, updated);
    if (nextId) setCurrentId(nextId);
    else finishSession(updated);
  };

  if (subPhase === "summary") {
    return (
      <div className="max-w-2xl mx-auto px-4 sm:px-8 py-6 sm:py-10 relative animate-fade-up">
        <Confetti />
        <Trophy size={32} className="text-amber-500 dark:text-amber-300 mb-4 animate-pop" />
        <p className="text-xs uppercase tracking-[0.2em] text-[color:var(--accent-text)] mb-1">学 · Fully memorized</p>
        <h2 className="text-2xl font-semibold text-[color:var(--text)] mb-2">All {pool.length} word{pool.length === 1 ? "" : "s"} reached 100%</h2>
        <p className="text-sm text-[color:var(--text-dim)] mb-6">Tap any word for its full page — definition, examples, and collocations.</p>

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-8">
          {pool.map((w) => (
            <button key={w.id} onClick={() => onOpenDetail(list.id, w.id)}
              className="text-left rounded-xl bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] p-4 hover:ring-accent-500/40 transition">
              <div className="flex items-center gap-2 mb-1">
                <span className="text-lg">{VIBE_EMOJI[w.vibe] || "✨"}</span>
                <span className="text-sm font-semibold text-[color:var(--text)]">{w.word}</span>
              </div>
              <p className="text-xs text-[color:var(--text-dim)] truncate">{w.def}</p>
            </button>
          ))}
        </div>

        <div className="flex gap-3">
          <button onClick={() => setView("quiz")}
            className="flex-1 flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-lg bg-gradient-to-r from-accent-500 to-teal-500 text-[#0a0e14] font-semibold hover:from-accent-400 hover:to-teal-400 transition">
            <Zap size={15} /> Test these words now
          </button>
          <button onClick={onExit}
            className="px-4 py-2.5 rounded-lg bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] text-[color:var(--text)] text-sm font-medium hover:ring-accent-500/40 transition">
            Back to Learn
          </button>
        </div>
      </div>
    );
  }

  const word = pool.find((w) => w.id === currentId);
  if (!word) {
    return (
      <div className="max-w-2xl mx-auto px-4 sm:px-8 py-10 sm:py-16 text-center">
        <p className="text-sm text-[color:var(--text-dim)] mb-4">Nothing left to memorize in this batch right now.</p>
        <button onClick={onExit} className="px-4 py-2 rounded-lg bg-accent-500 text-[#0a0e14] text-sm font-medium hover:bg-accent-400">Back to Learn</button>
      </div>
    );
  }
  const cur = data[currentId];
  const doneCount = Object.values(data).filter((d) => d.done).length;
  const coll = (word.coll || "").split(",").map((c) => c.trim()).filter(Boolean);
  const examples = buildExamples(word);

  const previewRate = (rating) => {
    if (!cur.memStarted) return rating === "know" ? 100 : rating === "blurry" ? 20 : 0;
    return rating === "know" ? Math.min(100, cur.memRate + 20) : rating === "blurry" ? Math.min(100, cur.memRate + 10) : cur.memRate;
  };
  // Mirrors the exact scheduling finishSession() applies on mastery, so the
  // "I remember it" button can preview the real next-review date instead of
  // just the memorized percentage — same box-bump, same LEITNER_DAYS lookup.
  const nextReviewDays = (() => {
    const boxBump = Math.min(6, (word.box || 0) + 1);
    return LEITNER_DAYS[Math.min(boxBump, LEITNER_DAYS.length - 1)];
  })();
  const highlightWord = (sentence) => {
    const re = new RegExp(`(${word.word})`, "i");
    const parts = sentence.split(re);
    return parts.map((p, i) => re.test(p) && p.toLowerCase() === word.word.toLowerCase()
      ? <span key={i} className="text-[color:var(--accent-text)] font-semibold">{p}</span>
      : <span key={i}>{p}</span>);
  };

  return (
    <div className="max-w-2xl mx-auto px-4 sm:px-8 py-6 sm:py-10">
      <div className="flex items-center justify-between mb-6">
        <p className="text-xs uppercase tracking-[0.2em] text-[color:var(--accent-text)]">学 · Deep Memorize</p>
        <p className="text-xs text-[color:var(--text-faint)]">{doneCount}/{pool.length} at 100%</p>
      </div>
      <div className="h-1.5 rounded-full bg-[color:var(--surface2)] mb-8 overflow-hidden">
        <div className="h-full bg-accent-500 transition-all" style={{ width: `${(doneCount / pool.length) * 100}%` }} />
      </div>

      <div className="rounded-2xl overflow-hidden bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] min-h-[360px] flex flex-col">
        <div className="px-8 py-7 bg-gradient-to-br from-teal-500/25 via-accent-500/15 to-transparent border-b border-[color:var(--border)]">
          <div className="flex items-center justify-between mb-3">
            <span className="text-2xl">{VIBE_EMOJI[word.vibe] || "✨"}</span>
            <span className="text-[11px] font-medium px-2.5 py-1 rounded-full bg-black/10 dark:bg-white/10 text-[color:var(--text)]">{cur.memRate}% memorized</span>
          </div>
          <h3 className="text-4xl sm:text-5xl font-bold text-[color:var(--text)] tracking-tight inline-flex items-center gap-2">
            {word.word}
            <AudioPronunciationButton word={word.word} size={20} />
          </h3>
          <p className="text-xs uppercase tracking-widest text-[color:var(--text-faint)] mt-1">{word.vibe}</p>
        </div>

        <div className="flex-1 flex flex-col justify-center px-8 py-6">
          {!showDetails ? (
            <div className="text-center py-6">
              <button onClick={() => setShowDetails(true)}
                className="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-accent-500 text-[#0a0e14] text-sm font-semibold hover:bg-accent-400 transition">
                <Sparkles size={14} /> Show definition & details
              </button>
            </div>
          ) : (
            <div className="text-left w-full space-y-5">
              <div>
                <p className="text-[10px] uppercase tracking-wide text-[color:var(--text-faint)] mb-1.5">Definition</p>
                <p className="text-base text-[color:var(--text)] leading-relaxed">{word.def}</p>
              </div>

              {examples.length > 0 && (
                <div>
                  <p className="text-[10px] uppercase tracking-wide text-[color:var(--text-faint)] mb-1.5">例句 · Examples</p>
                  <div className="space-y-2">
                    {examples.slice(0, 3).map((s, i) => (
                      <div key={i} className="flex items-start gap-1.5">
                        <p className="flex-1 text-sm text-[color:var(--text-dim)] italic leading-relaxed">{highlightWord(s)}</p>
                        <AudioPronunciationButton word={s} size={12} className="shrink-0 mt-0.5" />
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {coll.length > 0 && (
                <div>
                  <p className="text-[10px] uppercase tracking-wide text-[color:var(--text-faint)] mb-1.5">助记 · Related phrases</p>
                  <div className="flex flex-wrap gap-2">
                    {coll.map((c, i) => <span key={i} className="text-xs px-2.5 py-1 rounded-full bg-accent-500/15 text-[color:var(--accent-text)] ring-1 ring-accent-500/30">{c}</span>)}
                  </div>
                </div>
              )}

              <div>
                <p className="text-[10px] uppercase tracking-wide text-[color:var(--text-faint)] mb-1.5">记忆历史 · Memory history</p>
                <div className="flex items-center gap-4 text-xs text-[color:var(--text-dim)]">
                  <span className="flex items-center gap-1"><Check size={12} className="text-accent-500" /> {word.correctCount || 0} correct</span>
                  <span className="flex items-center gap-1"><X size={12} className="text-rose-500" /> {word.wrongCount || 0} missed</span>
                  <span>Box {word.box || 0}/6</span>
                </div>
                <div className="flex gap-1 mt-2">
                  {Array.from({ length: 6 }).map((_, i) => (
                    <span key={i} className={`h-1.5 flex-1 rounded-full ${i < (word.box || 0) ? "bg-accent-500" : "bg-[color:var(--surface2)]"}`} />
                  ))}

        </div>

        {showDetails && (
          <div className="px-8 pb-8">
            <p className="text-xs text-[color:var(--text-faint)] mb-2 text-center">
              {cur.memStarted ? "How well do you remember it now?" : "Did you already know this word?"}
            </p>

                className="flex-1 py-2.5 rounded-lg text-sm font-medium ring-1 bg-rose-500/10 text-rose-700 dark:text-rose-300 ring-rose-500/30 hover:bg-rose-500/15 transition">

                <span className="block text-[10px] opacity-70 mt-0.5">stays at {previewRate("forgot")}%</span>
              </button>
              <button onClick={() => rate("blurry")}
                className="flex-1 py-2.5 rounded-lg text-sm font-medium ring-1 bg-amber-500/10 text-amber-700 dark:text-amber-300 ring-amber-500/30 hover:bg-amber-500/15 transition">
                <span className="block">Blurry</span>
                <span className="block text-[10px] opacity-70 mt-0.5">→ {previewRate("blurry")}%</span>
              </button>
              <button onClick={() => rate("know")}
                className="flex-1 py-2.5 rounded-lg text-sm font-medium ring-1 bg-accent-500/10 text-accent-700 dark:text-accent-300 ring-accent-500/30 hover:bg-accent-500/15 transition">
                <span className="block">I remember it</span>
                <span className="block text-[10px] opacity-70 mt-0.5">
                  {previewRate("know") >= 100 ? `mastered! next review in ${nextReviewDays}d` : `→ ${previewRate("know")}%`}

        )}

const LEARN_MODES = [
  { id: "quick", label: "Quick Preview", desc: "Skim new words fast with rotating card styles." },
  { id: "deep", label: "Deep Memorize", desc: "Self-rate each word until it's fully memorized." },
  { id: "yesterday", label: "Review Yesterday", desc: "Go back over everything you learned yesterday." },
];

function LearnView({ list, updateList, setStats, registerActivity, onOpenDetail, setView }) {
  const [phase, setPhase] = useState("home");
  const [mode, setMode] = useState(() => load(nsKey("learnMode"), "quick"));
  const [sessionPool, setSessionPool] = useState([]);
  const [memPool, setMemPool] = useState([]);
  const [idx, setIdx] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const [enabledStyles, setEnabledStyles] = useState(() => load(nsKey("learnStyles"), LEARN_STYLES.map((s) => s.id)));

  useEffect(() => save(nsKey("learnStyles"), enabledStyles), [enabledStyles]);
  useEffect(() => save(nsKey("learnMode"), mode), [mode]);

  const pending = useMemo(() => getLearnPool(list), [list]);
  const memPending = useMemo(() => getMemorizePool(list), [list]);
  const yesterdayPending = useMemo(() => getYesterdayPool(list), [list]);
  const styles = enabledStyles.length ? enabledStyles : ["reveal"];

  const toggleStyle = (id) => {
    setEnabledStyles((cur) => {
      if (cur.includes(id)) {
        if (cur.length === 1) return cur;
        return cur.filter((s) => s !== id);
      }
      return [...cur, id];
    });
  };

  const start = () => {
    if (mode === "deep") {
      if (!memPending.length) return;
      setMemPool(memPending);
      setPhase("deep");
      return;
    }
    if (mode === "yesterday") {
      if (!yesterdayPending.length) return;
      setMemPool(yesterdayPending);
      setPhase("deep");
      return;
    }
    if (!pending.length) return;
    setSessionPool(pending);
    setIdx(0);
    setRevealed(false);
    setPhase("session");
  };

  const finish = (pool) => {
    const today = todayStr();
    updateList(list.id, (l) => ({
      ...l,
      words: l.words.map((w) => {
        if (!pool.some((p) => p.id === w.id)) return w;
        return { ...w, seen: true, box: 1, due: addDays(today, LEITNER_DAYS[1]), learnedOn: today };
      }),
    }));
    setStats((s) => ({ ...s, dailyLearned: { ...(s.dailyLearned || {}), [today]: ((s.dailyLearned || {})[today] || 0) + pool.length } }));
    registerActivity();
    setPhase("summary");
  };

  const next = () => {
    if (idx + 1 >= sessionPool.length) {
      finish(sessionPool);
    } else {
      setIdx(idx + 1);
      setRevealed(false);
    }
  };

  if (phase === "deep") {
    return (
      <MemorizeSession list={list} pool={memPool} updateList={updateList} setStats={setStats}
        registerActivity={registerActivity} onOpenDetail={onOpenDetail} setView={setView}
        onExit={() => setPhase("home")} />
    );
  }

  if (phase === "home") {
    const activePending = mode === "deep" ? memPending : mode === "yesterday" ? yesterdayPending : pending;
    return (
      <div className="max-w-2xl mx-auto px-4 sm:px-8 py-10 sm:py-16 text-center">
        <GraduationCap size={36} className="mx-auto text-[color:var(--accent-text)] mb-4" />

        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
          {LEARN_MODES.map((m) => (
            <button key={m.id} onClick={() => setMode(m.id)}
