function migrateLegacyAuth() {
  if (localStorage.getItem("vcw_migrated_v2")) return;
  try {
    const oldAccountRaw = localStorage.getItem("vcw_account");
    if (oldAccountRaw) {
      const oldAccount = JSON.parse(oldAccountRaw);
      if (oldAccount && oldAccount.email) {
        const accounts = JSON.parse(localStorage.getItem("vcw_accounts") || "[]");
        if (!accounts.some((a) => a.email === oldAccount.email)) accounts.push(oldAccount);
        localStorage.setItem("vcw_accounts", JSON.stringify(accounts));
        localStorage.setItem("vcw_currentEmail", JSON.stringify(oldAccount.email));
        ["apiKey", "model", "lists", "activeList", "stats", "streak", "learnStyles", "learnMode", "quizStyles", "quizMode"].forEach((base) => {
          const oldFlat = localStorage.getItem(`vcw_${base}`);
          if (oldFlat != null) localStorage.setItem(`vcw_acct_${oldAccount.email}_${base}`, oldFlat);
        });
      }
    }
  } catch { /* best-effort migration — leave data as-is on failure */ }
  localStorage.setItem("vcw_migrated_v2", "1");
}

const PERSONALIZED_LIST_SIZE = 30;
const PERSONALIZED_LIST_DAYS = 28;

function buildPersonalizedWordList(estimate, topicId) {
  let pool;
  if (topicId && topicId !== "mixed") {
    const topic = TOPIC_PACKS.find((t) => t.id === topicId);
    pool = topic ? [...topic.words] : [];
  } else {
    const maxIdx = VOCAB_TEST_TIERS.length - 1;
    // First tier whose pool exceeds the estimate = the user's current level.
    // If they're past every tier (beyond C2), anchor on the last one instead
    // of falling off the end. Both bounds are clamped explicitly so a
    // boundary estimate (or a future tier list edit) can never slice with an
    // out-of-range or empty index.
    let tierIdx = VOCAB_TEST_TIERS.findIndex((t) => estimate < t.pool);
    if (tierIdx === -1) tierIdx = maxIdx;
    const lowIdx = Math.max(0, Math.min(tierIdx, maxIdx));
    const highIdx = Math.max(0, Math.min(tierIdx + 1, maxIdx));
    const nearTiers = [VOCAB_TEST_TIERS[lowIdx], VOCAB_TEST_TIERS[highIdx]];
    pool = [...new Set(nearTiers.flatMap((t) => t.words.map((w) => w.w)))];
  }
  return [...pool].sort(() => Math.random() - 0.5).slice(0, Math.min(PERSONALIZED_LIST_SIZE, pool.length));
}

function planForWordCount(wordCount) {
  const newPerDay = Math.max(1, Math.ceil(wordCount / PERSONALIZED_LIST_DAYS));
  return { newPerDay, reviewPerDay: newPerDay * 2 };
}

// US/UK pronunciation. Browser voice availability varies a lot by OS — the
// fallback chain always finds *some* English voice, but which accent you
// actually get depends on what the browser shipped.
function speakWord(word, accent, onStart, onEnd) {
  if (typeof window === "undefined" || !window.speechSynthesis) return;
  const synth = window.speechSynthesis;
  const utter = new SpeechSynthesisUtterance(word);
  const voices = synth.getVoices();
  const targetLang = accent === "uk" ? "en-GB" : "en-US";
  const preferred = voices.find((v) => v.lang === targetLang && /Google|Natural|Daniel|Samantha|Alex|Kate|Serena|Arthur|Karen/i.test(v.name))
    || voices.find((v) => v.lang === targetLang)
    || voices.find((v) => (v.lang || "").startsWith("en"));
  if (preferred) utter.voice = preferred;
  utter.rate = 0.92;
  utter.pitch = 1;
  utter.onstart = () => onStart && onStart();
  utter.onend = () => onEnd && onEnd();
  utter.onerror = () => onEnd && onEnd();
  synth.cancel();
  synth.speak(utter);
}

function suggestPlan(total) {
  if (total <= 10) return null;
  const newPerDay = Math.min(15, Math.max(3, Math.ceil(total / 14)));
  const reviewPerDay = Math.min(30, Math.max(5, newPerDay * 2));
  return { newPerDay, reviewPerDay };
}
function getLearnPool(list) {
  const unseen = list.words.filter((w) => !w.seen);
  const cap = list.plan ? list.plan.newPerDay : Math.min(8, unseen.length || 8);
  return unseen.slice(0, cap);
}
function getMemorizePool(list) {
  const unfinished = list.words.filter((w) => (w.memRate || 0) < 100);
  const planned = list.plan && Number.isFinite(list.plan.newPerDay) ? list.plan.newPerDay : 0;
  const cap = Math.max(5, planned || 10);
  return unfinished.slice(0, cap);
}

function projectPlanForDate(list, dateStr) {
  const today = todayStr();
  if (!list) return { kind: dateStr <= today ? "past" : "future", plan: null };
  const plan = list.plan;
  if (dateStr <= today) return { kind: "past", plan, goal: plan?.newPerDay ?? null };
  if (!plan) return { kind: "future", plan: null };
  const unseenTotal = list.words.filter((w) => !w.seen).length;
  const dayOffset = Math.round((Date.parse(dateStr) - Date.parse(today)) / 86400000);
  const introducedBeforeThisDay = Math.min(unseenTotal, plan.newPerDay * Math.max(0, dayOffset - 1));
  const remainingAtStart = Math.max(0, unseenTotal - introducedBeforeThisDay);
  const newCount = Math.min(plan.newPerDay, remainingAtStart);
  const anyLearnedYet = list.words.some((w) => w.seen);
  const reviewCount = (anyLearnedYet || introducedBeforeThisDay > 0) ? plan.reviewPerDay : 0;
  return { kind: "future", plan, newCount, reviewCount };
}

  const words = list.words;

  const today = todayStr();

  return pool.length ? pool : words.filter((w) => w.seen).slice(0, 10);

}

async function authRequest(path, method, body, token) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers["Authorization"] = `Bearer ${token}`;
  let lastErr;
  for (let attempt = 0; attempt <= 2; attempt++) {
    if (attempt > 0) await new Promise((r) => setTimeout(r, 600 * attempt));
    let res;
    try {
      res = await fetch(`${AUTH_BASE}${path}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
    } catch {
      lastErr = new Error("Network error — check your connection.");
      continue;
    }
    let data = {};
    try { data = await res.json(); } catch { /* empty body */ }
    if (res.ok) return data;
    if (res.status >= 500 || res.status === 429) { lastErr = new Error(data.error || `Request failed (HTTP ${res.status})`); continue; }
    const err = new Error(data.error || `Request failed (HTTP ${res.status})`);
    err.data = data;
    throw err;
  }
  throw lastErr;
}

// Accounts live on the server (Cloudflare KV via the same worker as the
// leaderboard): passwords are PBKDF2-hashed server-side, registration and
// password reset go through a 6-digit emailed code, and login accepts either
// a username or an email. Personal app data (word lists, stats, API key)
// stays local per nsKey() — only identity/auth is server-backed.
function AuthGate({ onAuth }) {
  const [mode, setMode] = useState("login"); // login | register | verify | forgot | reset
  const [identifier, setIdentifier] = useState("");
  const [username, setUsername] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [code, setCode] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [error, setError] = useState(null);
  const [info, setInfo] = useState(null);
  const [loading, setLoading] = useState(false);
  const [resendCooldown, setResendCooldown] = useState(0);

  useEffect(() => {
    if (resendCooldown <= 0) return;
    const t = setTimeout(() => setResendCooldown((c) => c - 1), 1000);
    return () => clearTimeout(t);
  }, [resendCooldown]);

  const switchMode = (m) => { setMode(m); setError(null); setInfo(null); };

  const finishLogin = (data) => {
    save(LS.currentEmail, data.email);
    save(LS.currentUsername, data.username);
    save(LS.sessionToken, data.token);
    save(LS.loggedIn, true);
    onAuth();
  };

  const submitLogin = async (e) => {
    e.preventDefault();
    setError(null); setInfo(null);
    if (!identifier.trim() || !password) { setError("Enter your username/email and password."); return; }
    setLoading(true);
    try {
      const data = await authRequest("/auth/login", "POST", { identifier: identifier.trim(), password });
      finishLogin(data);
    } catch (err) {
      if (err.data?.needsVerification) {
        setEmail(err.data.email);
        setMode("verify");
        setInfo("Verify your email to finish logging in — check your inbox for the code.");
      } else {
        setError(err.message);
      }
    } finally { setLoading(false); }
  };

  const submitRegister = async (e) => {
    e.preventDefault();
    setError(null); setInfo(null);
    if (!username.trim() || !email.trim() || !password) { setError("Fill in every field to create your account."); return; }
    setLoading(true);
    try {
      await authRequest("/auth/register", "POST", { username: username.trim(), email: email.trim(), password });
      setMode("verify");
      setInfo(`We sent a 6-digit code to ${email.trim()}.`);
      setResendCooldown(30);
    } catch (err) { setError(err.message); } finally { setLoading(false); }
  };

  const submitVerify = async (e) => {
    e.preventDefault();
    setError(null); setInfo(null);
    if (!code.trim()) { setError("Enter the 6-digit code."); return; }
    setLoading(true);
    try {
      const data = await authRequest("/auth/verify", "POST", { email: email.trim(), code: code.trim() });
      finishLogin(data);
    } catch (err) { setError(err.message); } finally { setLoading(false); }
  };

  const resendCode = async (purpose) => {
    setError(null); setInfo(null);
    setLoading(true);
    try {
      await authRequest("/auth/resend", "POST", { email: email.trim(), purpose });
      setInfo("Code resent — check your inbox.");
      setResendCooldown(30);
    } catch (err) { setError(err.message); } finally { setLoading(false); }
  };

  const submitForgot = async (e) => {
    e.preventDefault();
    setError(null); setInfo(null);
    if (!email.trim()) { setError("Enter your account email."); return; }
    setLoading(true);
    try {
      await authRequest("/auth/forgot", "POST", { email: email.trim() });
      setMode("reset");
      setInfo(`If an account exists for ${email.trim()}, we sent a reset code.`);
      setResendCooldown(30);
    } catch (err) { setError(err.message); } finally { setLoading(false); }
  };

  const submitReset = async (e) => {
    e.preventDefault();
    setError(null); setInfo(null);
    if (!code.trim() || newPassword.length < 6) { setError("Enter the code and a password of at least 6 characters."); return; }
    setLoading(true);
    try {
      await authRequest("/auth/reset", "POST", { email: email.trim(), code: code.trim(), newPassword });
      setIdentifier(email.trim());
      setPassword("");
      switchMode("login");
      setInfo("Password reset — log in with your new password.");
    } catch (err) { setError(err.message); } finally { setLoading(false); }
  };

  return (
    <div className="min-h-screen w-full flex items-center justify-center bg-[color:var(--bg)] px-6"
      style={{ fontFamily: "'Inter', ui-sans-serif, system-ui" }}>
      <div className="w-full max-w-sm">
        <div className="flex flex-col items-center mb-8">
          <div className="h-12 w-12 rounded-2xl bg-gradient-to-br from-indigo-500 via-violet-500 to-fuchsia-500 flex items-center justify-center shadow-sm shadow-violet-500/30 mb-3">
            <BrandMark size={24} className="text-white" />
          </div>
          <h1 className="text-lg font-semibold text-[color:var(--text)]">Vocab Master</h1>
          <p className="text-xs text-[color:var(--text-dim)] mt-0.5">Learn it. Own it.</p>
        </div>

        <div className="rounded-2xl bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] p-6 shadow-lg">
          {(mode === "login" || mode === "register") && (
            <div className="flex rounded-lg bg-[color:var(--surface2)] p-1 mb-5">
              <button type="button" onClick={() => switchMode("login")}
                className={`flex-1 py-1.5 rounded-md text-sm font-medium transition ${mode === "login" ? "bg-[color:var(--surface)] text-[color:var(--text)] shadow-sm" : "text-[color:var(--text-faint)]"}`}>
                Log in
              </button>
              <button type="button" onClick={() => switchMode("register")}
                className={`flex-1 py-1.5 rounded-md text-sm font-medium transition ${mode === "register" ? "bg-[color:var(--surface)] text-[color:var(--text)] shadow-sm" : "text-[color:var(--text-faint)]"}`}>
                Register
              </button>
            </div>
          )}

          {mode === "verify" && (
            <div className="mb-5">
              <h2 className="text-sm font-semibold text-[color:var(--text)]">Verify your email</h2>
              <p className="text-xs text-[color:var(--text-dim)] mt-1 font-mono">{email}</p>
            </div>
          )}
          {mode === "forgot" && (
            <div className="mb-5"><h2 className="text-sm font-semibold text-[color:var(--text)]">Reset your password</h2></div>
          )}
          {mode === "reset" && (
            <div className="mb-5">
              <h2 className="text-sm font-semibold text-[color:var(--text)]">Enter your reset code</h2>
              <p className="text-xs text-[color:var(--text-dim)] mt-1 font-mono">{email}</p>
            </div>
          )}

          {mode === "login" && (
            <form onSubmit={submitLogin} className="space-y-3">
              <div>
                <label className="block text-xs text-[color:var(--text-dim)] mb-1.5">Username or email</label>
                <input value={identifier} onChange={(e) => setIdentifier(e.target.value)} placeholder="ada or ada@example.com"
                  className="w-full bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] rounded-lg px-3 py-2.5 text-sm text-[color:var(--text)] focus:outline-none focus:ring-accent-500/50" />
              </div>
              <div>
                <div className="flex items-center justify-between mb-1.5">
                  <label className="block text-xs text-[color:var(--text-dim)]">Password</label>
                  <button type="button" onClick={() => switchMode("forgot")} className="text-[11px] text-[color:var(--accent-text)] hover:underline">
                    Forgot password?
                  </button>
                </div>
                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••"
                  className="w-full bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] rounded-lg px-3 py-2.5 text-sm text-[color:var(--text)] focus:outline-none focus:ring-accent-500/50" />
              </div>
              {error && <p className="text-[11px] text-rose-700 dark:text-rose-300">{error}</p>}
              {info && <p className="text-[11px] text-accent-700 dark:text-accent-300">{info}</p>}
              <button type="submit" disabled={loading}
                className="w-full py-2.5 rounded-lg bg-accent-500 text-[#0a0e14] text-sm font-semibold hover:bg-accent-400 disabled:opacity-50 transition">
                {loading ? "Logging in…" : "Log in"}
              </button>
            </form>
          )}

          {mode === "register" && (
            <form onSubmit={submitRegister} className="space-y-3">
              <div>
                <label className="block text-xs text-[color:var(--text-dim)] mb-1.5">Username</label>
                <input value={username} onChange={(e) => setUsername(e.target.value)} placeholder="ada"
                  className="w-full bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] rounded-lg px-3 py-2.5 text-sm text-[color:var(--text)] focus:outline-none focus:ring-accent-500/50" />
              </div>
              <div>
                <label className="block text-xs text-[color:var(--text-dim)] mb-1.5">Email</label>
                <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com"
                  className="w-full bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] rounded-lg px-3 py-2.5 text-sm text-[color:var(--text)] focus:outline-none focus:ring-accent-500/50" />
              </div>
              <div>
                <label className="block text-xs text-[color:var(--text-dim)] mb-1.5">Password</label>
                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="At least 6 characters"
                  className="w-full bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] rounded-lg px-3 py-2.5 text-sm text-[color:var(--text)] focus:outline-none focus:ring-accent-500/50" />
              </div>
              {error && <p className="text-[11px] text-rose-700 dark:text-rose-300">{error}</p>}
              <button type="submit" disabled={loading}
                className="w-full py-2.5 rounded-lg bg-accent-500 text-[#0a0e14] text-sm font-semibold hover:bg-accent-400 disabled:opacity-50 transition">
                {loading ? "Creating account…" : "Create account"}
              </button>
            </form>
          )}

          {mode === "verify" && (
            <form onSubmit={submitVerify} className="space-y-3">
              {info && <p className="text-[11px] text-accent-700 dark:text-accent-300">{info}</p>}
              <div>
                <label className="block text-xs text-[color:var(--text-dim)] mb-1.5">6-digit code</label>
                <input value={code} onChange={(e) => setCode(e.target.value.replace(/\D/g, "").slice(0, 6))} placeholder="123456" inputMode="numeric"
                  className="w-full bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] rounded-lg px-3 py-2.5 text-sm tracking-[0.3em] text-center text-[color:var(--text)] focus:outline-none focus:ring-accent-500/50" />
              </div>
              {error && <p className="text-[11px] text-rose-700 dark:text-rose-300">{error}</p>}
              <button type="submit" disabled={loading}
                className="w-full py-2.5 rounded-lg bg-accent-500 text-[#0a0e14] text-sm font-semibold hover:bg-accent-400 disabled:opacity-50 transition">
                {loading ? "Verifying…" : "Verify"}
              </button>
              <button type="button" onClick={() => resendCode("register")} disabled={resendCooldown > 0 || loading}
                className="w-full py-2 text-xs text-[color:var(--text-dim)] hover:text-[color:var(--text)] disabled:opacity-40 transition">
                {resendCooldown > 0 ? `Resend code (${resendCooldown}s)` : "Resend code"}
              </button>
            </form>
          )}

          {mode === "forgot" && (
            <form onSubmit={submitForgot} className="space-y-3">
              <div>
                <label className="block text-xs text-[color:var(--text-dim)] mb-1.5">Account email</label>
                <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com"
                  className="w-full bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] rounded-lg px-3 py-2.5 text-sm text-[color:var(--text)] focus:outline-none focus:ring-accent-500/50" />
              </div>
              {error && <p className="text-[11px] text-rose-700 dark:text-rose-300">{error}</p>}
              <button type="submit" disabled={loading}
                className="w-full py-2.5 rounded-lg bg-accent-500 text-[#0a0e14] text-sm font-semibold hover:bg-accent-400 disabled:opacity-50 transition">
                {loading ? "Sending…" : "Send reset code"}
              </button>
              <button type="button" onClick={() => switchMode("login")} className="w-full py-2 text-xs text-[color:var(--text-dim)] hover:text-[color:var(--text)] transition">
                Back to log in
              </button>
            </form>
          )}

          {mode === "reset" && (
            <form onSubmit={submitReset} className="space-y-3">
              {info && <p className="text-[11px] text-accent-700 dark:text-accent-300">{info}</p>}
              <div>
                <label className="block text-xs text-[color:var(--text-dim)] mb-1.5">6-digit code</label>
                <input value={code} onChange={(e) => setCode(e.target.value.replace(/\D/g, "").slice(0, 6))} placeholder="123456" inputMode="numeric"
                  className="w-full bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] rounded-lg px-3 py-2.5 text-sm tracking-[0.3em] text-center text-[color:var(--text)] focus:outline-none focus:ring-accent-500/50" />
              </div>
              <div>
                <label className="block text-xs text-[color:var(--text-dim)] mb-1.5">New password</label>
                <input type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} placeholder="At least 6 characters"
                  className="w-full bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] rounded-lg px-3 py-2.5 text-sm text-[color:var(--text)] focus:outline-none focus:ring-accent-500/50" />
              </div>
              {error && <p className="text-[11px] text-rose-700 dark:text-rose-300">{error}</p>}
              <button type="submit" disabled={loading}
                className="w-full py-2.5 rounded-lg bg-accent-500 text-[#0a0e14] text-sm font-semibold hover:bg-accent-400 disabled:opacity-50 transition">
                {loading ? "Resetting…" : "Reset password"}
              </button>
              <button type="button" onClick={() => resendCode("reset")} disabled={resendCooldown > 0 || loading}
                className="w-full py-2 text-xs text-[color:var(--text-dim)] hover:text-[color:var(--text)] disabled:opacity-40 transition">
                {resendCooldown > 0 ? `Resend code (${resendCooldown}s)` : "Resend code"}
              </button>
            </form>
          )}
        </div>
        <p className="text-[11px] text-[color:var(--text-faint)] text-center mt-4 leading-relaxed">
          Your word lists, progress, and API key stay local to this browser. Only your account — email, username, and password — lives on the server, so you can log in and reset your password from anywhere.
        </p>
      </div>
    </div>
  );
}

/* ---------------- App ---------------- */
function App({ onLogout }) {
  const [view, setView] = useState("dashboard");
  const [provider, setProvider] = useState(() => load(nsKey("provider"), DEFAULT_PROVIDER));
  const [providerKeys, setProviderKeys] = useState(() => {
    const stored = load(nsKey("providerKeys"), null);
    if (stored) return stored;
    // one-time migration from the old single-provider (Anthropic-only) storage
    const legacyKey = load(nsKey("apiKey"), "");
    return legacyKey ? { anthropic: legacyKey } : {};
  });
  const [providerModels, setProviderModels] = useState(() => {
    const stored = load(nsKey("providerModels"), null);
    if (stored) return stored;
    const legacyModel = load(nsKey("model"), "");
    return legacyModel ? { anthropic: legacyModel } : {};
  });
  const apiKey = providerKeys[provider] || "";
  const model = providerModels[provider] || PROVIDERS[provider].models[0].id;
  const setApiKey = (key) => setProviderKeys((pk) => ({ ...pk, [provider]: key }));
  const setModel = (m) => setProviderModels((pm) => ({ ...pm, [provider]: m }));
  const [theme, setTheme] = useState(() => load(LS.theme, "dark"));
  const [lists, setLists] = useState(() => repairListIds(load(nsKey("lists"), [
    { id: "default", name: "My Words", source: "custom", plan: null, createdAt: Date.now(), words: SEED_WORDS },
  ])));
  const [activeListId, setActiveListId] = useState(() => load(nsKey("activeList"), "default"));
  const [stats, setStats] = useState(() => load(nsKey("stats"), { sessions: 0, dailyLearned: {} }));
  const [streak, setStreak] = useState(() => load(nsKey("streak"), { count: 0, last: null }));
  const [detailWord, setDetailWord] = useState(null);
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const [showKeyModal, setShowKeyModal] = useState(false);
  const [profile, setProfile] = useState(() => {
    const stored = load(nsKey("profile"), null);
    if (stored) return stored;
    return { userId: genId(), displayName: load(LS.currentUsername, null) || "Learner", leaderboardOptIn: false };
  });
  const [uiLang, setUiLang] = useState(() => load(nsKey("uiLang"), navigator.language?.startsWith("zh") ? "zh" : "en"));
  const [vocabTestResult, setVocabTestResult] = useState(() => load(nsKey("vocabTestResult"), 0));

  const isAdmin = CURRENT_EMAIL === ADMIN_EMAIL;
  const [sessionInfo, setSessionInfo] = useState({ bonusPoints: 0, lastUsernameChange: null, vocabSizeOverride: null, streakOverride: null, wordsLearnedOverride: null, wordsMasteredOverride: null, leaderboardId: null });
  const refreshSessionInfo = () => {
    const token = load(LS.sessionToken, null);
    if (!token) return;
    fetch(`${AUTH_BASE}/auth/session`, { headers: { Authorization: `Bearer ${token}` } })
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => { if (d) setSessionInfo({ bonusPoints: d.bonusPoints || 0, lastUsernameChange: d.lastUsernameChange || null, vocabSizeOverride: d.vocabSizeOverride ?? null, streakOverride: d.streakOverride ?? null, wordsLearnedOverride: d.wordsLearnedOverride ?? null, wordsMasteredOverride: d.wordsMasteredOverride ?? null, leaderboardId: d.leaderboardId || null }); })
      .catch(() => {});
  };
  useEffect(() => { refreshSessionInfo(); }, []);
  const effectiveVocabSize = sessionInfo.vocabSizeOverride ?? vocabTestResult;
  // Tied to the account (via /auth/session), not generated locally per browser
  // — so logging in anywhere resolves to the same leaderboard row instead of
  // spawning a new one each time local storage is fresh.
  const leaderboardUserId = sessionInfo.leaderboardId || profile.userId;

  useEffect(() => save(nsKey("provider"), provider), [provider]);
  useEffect(() => save(nsKey("providerKeys"), providerKeys), [providerKeys]);
  useEffect(() => save(nsKey("providerModels"), providerModels), [providerModels]);
  useEffect(() => save(nsKey("profile"), profile), [profile]);
  useEffect(() => save(nsKey("uiLang"), uiLang), [uiLang]);
  useEffect(() => save(LS.theme, theme), [theme]);
  useEffect(() => save(nsKey("lists"), lists), [lists]);
  useEffect(() => save(nsKey("activeList"), activeListId), [activeListId]);
  useEffect(() => save(nsKey("stats"), stats), [stats]);
  useEffect(() => save(nsKey("streak"), streak), [streak]);
  useEffect(() => save(nsKey("vocabTestResult"), vocabTestResult), [vocabTestResult]);

  useEffect(() => {
    const apply = () => {
      const eff = theme === "system"
        ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : theme;
      document.documentElement.setAttribute("data-theme", eff);
    };
    apply();
    if (theme === "system") {
      const mq = window.matchMedia("(prefers-color-scheme: dark)");
      mq.addEventListener("change", apply);
      return () => mq.removeEventListener("change", apply);
    }
  }, [theme]);

  const activeList = useMemo(() => lists.find((l) => l.id === activeListId) || lists[0], [lists, activeListId]);
  useEffect(() => { if (activeList && activeList.id !== activeListId) setActiveListId(activeList.id); }, [activeList]);

  const allWords = useMemo(() => lists.flatMap((l) => l.words), [lists]);
  const totalIntroduced = allWords.filter((w) => w.seen).length;
  const totalMastered = allWords.filter((w) => w.box >= 5).length;

  // Admin overrides only affect what's shown on the leaderboard/counted for
  // points — they never touch the user's own local data (Dashboard keeps
  // showing real progress; the vocab test experience is untouched too).
  const effectiveTotalLearned = sessionInfo.wordsLearnedOverride ?? totalIntroduced;
  const effectiveTotalMastered = sessionInfo.wordsMasteredOverride ?? totalMastered;
  const effectiveStreak = sessionInfo.streakOverride ?? streak.count;

  // Points are derived from existing progress data rather than tracked as a
  // separate ledger, so they can never drift out of sync: +2 per word
  // introduced, +5 per word mastered, +10 per completed session, +1 per
  // streak day. What points unlock is still undecided — for now they're a
  // visible reward signal (Dashboard + leaderboard), nothing is spent yet.
  const points = effectiveTotalLearned * 2 + effectiveTotalMastered * 5 + stats.sessions * 10 + effectiveStreak + sessionInfo.bonusPoints;

  // Backfills real example sentences (dictionaryapi.dev) for words in the
  // active list that don't have any yet, in small batches, so seed/imported/
  // manually-added words all eventually get real examples instead of the
  // synthesized fallback in buildExamples(). `examples: []` marks "looked,
  // found nothing" so a word without a real example isn't retried forever.
  const missingExamplesCount = useMemo(
    () => activeList ? activeList.words.filter((w) => w.def && w.examples === undefined).length : 0,
    [activeList]
  );
  useEffect(() => {
    if (!activeList || !missingExamplesCount) return;
    const candidates = activeList.words.filter((w) => w.def && w.examples === undefined).slice(0, 40);
    let cancelled = false;
    (async () => {
      const results = await fetchExamplesBatch(candidates.map((w) => w.word));
      if (cancelled) return;
      let aiResults = {};
      if (apiKey) {
        const stillMissing = candidates.filter((w) => !results[w.word.trim().toLowerCase()]).slice(0, 10);
        if (stillMissing.length) aiResults = await fetchAiExamplesBatch(stillMissing, apiKey, model, provider).catch(() => ({}));
      }
      if (cancelled) return;
      updateList(activeList.id, (l) => ({
        ...l,
        words: l.words.map((w) => {
          if (!candidates.some((c) => c.id === w.id)) return w;
          const key = w.word.trim().toLowerCase();
          return { ...w, examples: results[key] || aiResults[key] || [] };
        }),
      }));
    })();
    return () => { cancelled = true; };
  }, [activeList?.id, missingExamplesCount]);

  useEffect(() => {
    if (!profile.leaderboardOptIn) return;
    const t = setTimeout(() => {
      fetch(`${LEADERBOARD_BASE}/leaderboard/submit`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          userId: leaderboardUserId,
          displayName: profile.displayName,
          stats: { totalLearned: effectiveTotalLearned, totalMastered: effectiveTotalMastered, vocabSize: effectiveVocabSize, streak: effectiveStreak, points },
        }),
      }).catch(() => {});
    }, 1200);
    return () => clearTimeout(t);
  }, [profile.leaderboardOptIn, leaderboardUserId, profile.displayName, effectiveTotalLearned, effectiveTotalMastered, effectiveVocabSize, effectiveStreak, points]);

  const prevOptIn = useRef(profile.leaderboardOptIn);
  useEffect(() => {
    if (prevOptIn.current && !profile.leaderboardOptIn) {
      fetch(`${LEADERBOARD_BASE}/leaderboard/remove`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },

      }).catch(() => {});

    prevOptIn.current = profile.leaderboardOptIn;

    const id = `custom-${Date.now()}`;
    const wordObjs = words.map((w) => freshWord({ word: w }));

    setLists((ls) => [...ls, { id, name, source: "custom", plan, createdAt: Date.now(), words: wordObjs }]);
    setActiveListId(id);
    setView("learn");
    freeDictLookupBatch(wordObjs.map((w) => w.word)).then((results) => {
      setLists((ls) => ls.map((l) => (l.id !== id ? l : {
        ...l,
        words: l.words.map((w) => {
          const found = results[w.word.trim().toLowerCase()];
          return found ? { ...w, def: found.def } : w;
        }),
      })));
    }).catch(() => {});
  };

    setStreak((s) => {
      if (s.last === t) return s;
      const yest = todayStr(new Date(Date.now() - 86400000));

/* ---------------- Calendar ---------------- */
function pad2(n) { return String(n).padStart(2, "0"); }

function CalendarHeatmap({ dailyLearned, activeList }) {
  const now = new Date();
  const [cursor, setCursor] = useState({ y: now.getFullYear(), m: now.getMonth() });
  const [selectedDate, setSelectedDate] = useState(todayStr());
  const monthLabel = new Date(cursor.y, cursor.m, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });

  const firstDow = new Date(cursor.y, cursor.m, 1).getDay();
  const daysInMonth = new Date(cursor.y, cursor.m + 1, 0).getDate();
  const todayKey = todayStr();

  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const intensity = (count) => {
    if (!count) return "bg-[color:var(--surface2)] text-[color:var(--text-faint)]";
    if (count <= 2) return "bg-accent-500/25 text-accent-800 dark:text-accent-100";
    if (count <= 5) return "bg-accent-500/50 text-accent-900 dark:text-white";
    return "bg-accent-500/80 text-white";
  };

  const isFuture = (y, m) => y > now.getFullYear() || (y === now.getFullYear() && m > now.getMonth());

  return (
    <div className="rounded-xl bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] p-5">
      <div className="flex items-center justify-between mb-4">
        <p className="text-sm font-semibold text-[color:var(--text)]">{monthLabel}</p>
        <div className="flex items-center gap-1">
          <button onClick={() => setCursor((c) => (c.m === 0 ? { y: c.y - 1, m: 11 } : { y: c.y, m: c.m - 1 }))}
            className="p-1 rounded-md text-[color:var(--text-faint)] hover:text-[color:var(--text)] hover:bg-white/5 transition">
            <ChevronLeft size={16} />
          </button>
          <button onClick={() => setCursor((c) => (c.m === 11 ? { y: c.y + 1, m: 0 } : { y: c.y, m: c.m + 1 }))}
            disabled={isFuture(cursor.m === 11 ? cursor.y + 1 : cursor.y, cursor.m === 11 ? 0 : cursor.m + 1)}
            className="p-1 rounded-md text-[color:var(--text-faint)] hover:text-[color:var(--text)] hover:bg-white/5 disabled:opacity-30 disabled:cursor-not-allowed transition">
            <ChevronRight size={16} />
          </button>
        </div>
      </div>

      <div className="grid grid-cols-7 gap-1.5 mb-1.5">
        {["S", "M", "T", "W", "T", "F", "S"].map((d, i) => (
          <div key={i} className="text-center text-[10px] uppercase tracking-wide text-[color:var(--text-faint)]">{d}</div>
        ))}
      </div>
      <div className="grid grid-cols-7 gap-1.5">
        {cells.map((d, i) => {
          if (!d) return <div key={i} />;
          const key = `${cursor.y}-${pad2(cursor.m + 1)}-${pad2(d)}`;
          const count = dailyLearned[key] || 0;
          const today = key === todayKey;
          const selected = key === selectedDate;
          return (
            <button key={i} onClick={() => setSelectedDate(key)} title={`${key}: ${count} word${count === 1 ? "" : "s"} learned`}
              className={`aspect-square rounded-md flex items-center justify-center text-[11px] font-medium transition ${intensity(count)} ${today ? "ring-2 ring-accent-500" : ""} ${selected ? "outline outline-2 outline-offset-1 outline-[color:var(--accent-text)]" : ""}`}>
              {d}
            </button>
          );
        })}
      </div>

      <div className="flex items-center justify-end gap-1.5 mt-4 text-[10px] text-[color:var(--text-faint)]">
        <span>Less</span>
        <span className="h-3 w-3 rounded bg-[color:var(--surface2)]" />
        <span className="h-3 w-3 rounded bg-accent-500/25" />
        <span className="h-3 w-3 rounded bg-accent-500/50" />
        <span className="h-3 w-3 rounded bg-accent-500/80" />
        <span>More</span>
      </div>

      {selectedDate && (
        <DayDetail dateStr={selectedDate} dailyLearned={dailyLearned} activeList={activeList} />
      )}
    </div>
  );
}

function DayDetail({ dateStr, dailyLearned, activeList }) {
  const info = projectPlanForDate(activeList, dateStr);
  const label = new Date(dateStr + "T00:00:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  const isToday = dateStr === todayStr();

  return (
    <div className="mt-4 pt-4 border-t border-[color:var(--border)]">
      <p className="text-xs font-medium text-[color:var(--text)] mb-2">{label}{isToday ? " · Today" : ""}</p>
      {info.kind === "past" ? (
        <>
          {(() => {
            const actual = dailyLearned[dateStr] || 0;
            const goal = info.goal;
            const pct = goal ? Math.min(100, Math.round((actual / goal) * 100)) : null;
            return (
              <>
                <p className="text-xs text-[color:var(--text-dim)]">
                  {actual} word{actual === 1 ? "" : "s"} learned{goal ? ` of a ${goal}-word goal` : ""}.
                </p>
                {goal !== null && (
                  <div className="h-1.5 rounded-full bg-[color:var(--surface2)] mt-2 overflow-hidden">
                    <div className="h-full bg-accent-500 transition-all" style={{ width: `${pct}%` }} />
                  </div>
                )}
              </>
            );
          })()}
        </>
      ) : info.plan ? (
        <p className="text-xs text-[color:var(--text-dim)]">
          Planned: ~{info.newCount} new word{info.newCount === 1 ? "" : "s"}{info.reviewCount ? ` + ~${info.reviewCount} review${info.reviewCount === 1 ? "" : "s"}` : ""}
          <span className="text-[color:var(--text-faint)]"> (estimate based on your current pace)</span>
        </p>
      ) : (
        <p className="text-xs text-[color:var(--text-faint)]">
          {activeList ? "No daily plan set for this list — add one in Word Lists to see projections here." : "Add a word list to see your plan here."}
        </p>
      )}
    </div>
  );
}

/* ---------------- Settings ---------------- */
async function adminRequest(path, method, body) {
  const token = load(LS.sessionToken, null);
  const res = await fetch(`${AUTH_BASE}${path}`, {
    method,
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch { /* empty body */ }
  if (!res.ok) throw new Error(data.error || `Request failed (HTTP ${res.status})`);
  return data;
}

const ADMIN_OVERRIDE_FIELDS = [
  { id: "vocabSize", label: "词汇量" },
  { id: "streak", label: "Streak" },
  { id: "wordsLearned", label: "Words learned" },
  { id: "wordsMastered", label: "Words mastered" },
];

function AdminUserRow({ u, query, loadUsers, setMessage }) {
  const [expanded, setExpanded] = useState(false);
  const [amount, setAmount] = useState("");
  const [usernameDraft, setUsernameDraft] = useState(u.username);
  const [overrideDrafts, setOverrideDrafts] = useState({
    vocabSize: u.vocabSizeOverride ?? "", streak: u.streakOverride ?? "",
    wordsLearned: u.wordsLearnedOverride ?? "", wordsMastered: u.wordsMasteredOverride ?? "",
  });

  const grantPoints = () => {
    const amt = Number(amount);
    if (!amt) return;
    setMessage(null);
    adminRequest("/admin/grant-points", "POST", { identifier: u.email, amount: amt })
      .then((d) => { setMessage(`Granted ${amt > 0 ? "+" : ""}${amt} pts to ${d.username} — new bonus total: ${d.bonusPoints.toLocaleString()}.`); setAmount(""); loadUsers(query); })
      .catch((e) => setMessage(e.message));
  };

  const setUsername = () => {
    setMessage(null);
    adminRequest("/admin/set-username", "POST", { identifier: u.email, newUsername: usernameDraft.trim() })
      .then((d) => { setMessage(`Renamed to ${d.username}.`); loadUsers(query); })
      .catch((e) => setMessage(e.message));
  };

  const setOverride = (field) => {
    const raw = overrideDrafts[field];
    const value = raw === "" ? null : Number(raw);
    setMessage(null);
    adminRequest("/admin/set-override", "POST", { identifier: u.email, field, value })
      .then((d) => { setMessage(value === null ? `Cleared ${field} override for ${d.username}.` : `Set ${field} to ${d.value.toLocaleString()} for ${d.username}.`); loadUsers(query); })
      .catch((e) => setMessage(e.message));
  };

  const toggleBanned = () => {
    setMessage(null);
    adminRequest("/admin/set-banned", "POST", { identifier: u.email, banned: !u.banned })
      .then((d) => { setMessage(d.banned ? `Suspended ${d.username}.` : `Restored ${d.username}.`); loadUsers(query); })
      .catch((e) => setMessage(e.message));
  };

  const forceReset = () => {
    setMessage(null);
    adminRequest("/admin/force-reset", "POST", { identifier: u.email })
      .then(() => setMessage(`Sent a password reset code to ${u.email}.`))
      .catch((e) => setMessage(e.message));

  const verifyUser = () => {
    adminRequest("/admin/verify-user", "POST", { email: u.email }).then(() => loadUsers(query)).catch((e) => setMessage(e.message));

          <div className="flex items-center gap-1">

  );

function AdminLeaderboardTab({ setMessage }) {
  const [cat, setCat] = useState("points");

    setLoading(true);
    fetch(`${LEADERBOARD_BASE}/leaderboard?category=${cat}&limit=100`)
      .then((r) => r.json())
      .then((d) => setEntries(d.entries || []))
      .catch(() => setMessage("Couldn't load the leaderboard."))
      .finally(() => setLoading(false));

    if (!window.confirm(`Remove ${name}'s leaderboard entry? They can rejoin later, but their spot resets.`)) return;

      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ userId: id }),
    }).then(() => load()).catch(() => setMessage("Couldn't remove that entry."));

  return (
    <section className="rounded-xl bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] p-6">

const DISPLAY_NAME_COOLDOWN_MS = 5 * 60 * 1000;
function formatRemaining(ms) {
  if (ms <= 0) return null;
  const days = Math.floor(ms / 86400000);
  const hours = Math.floor((ms % 86400000) / 3600000);
  const mins = Math.floor((ms % 3600000) / 60000);
  const secs = Math.floor((ms % 60000) / 1000);
  if (days > 0) return `${days}d ${hours}h`;
  if (hours > 0) return `${hours}h ${mins}m`;
  if (mins > 0) return `${mins}m ${secs}s`;
  return `${secs}s`;
}

function SettingsView({ apiKey, setApiKey, model, setModel, provider, setProvider, providerKeys, providerModels, theme, setTheme, onLogout, profile, setProfile, uiLang, setUiLang, sessionInfo, refreshSessionInfo, leaderboardUserId }) {
  const [draft, setDraft] = useState(apiKey);
  const [showKey, setShowKey] = useState(false);
  const [nameDraft, setNameDraft] = useState(profile.displayName);
  const [copied, setCopied] = useState(false);
  const [currentUsername, setCurrentUsername] = useState(() => load(LS.currentUsername, null));
  const [usernameDraft, setUsernameDraft] = useState(currentUsername || "");
  const [usernameMsg, setUsernameMsg] = useState(null);
  const [usernameLoading, setUsernameLoading] = useState(false);
  const [now, setNow] = useState(Date.now());
  const dirty = draft !== apiKey;
  const info = PROVIDERS[provider];

  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);

  const displayNameRemaining = profile.lastDisplayNameChange ? DISPLAY_NAME_COOLDOWN_MS - (now - profile.lastDisplayNameChange) : 0;
  const usernameRemaining = sessionInfo?.lastUsernameChange ? (7 * 24 * 60 * 60 * 1000) - (now - sessionInfo.lastUsernameChange) : 0;

  const saveDisplayName = () => {
    if (displayNameRemaining > 0) return;
    setProfile((p) => ({ ...p, displayName: nameDraft.trim() || "Learner", lastDisplayNameChange: Date.now() }));
  };

  const saveUsername = async () => {
    setUsernameMsg(null);
    if (usernameRemaining > 0) return;
    const trimmed = usernameDraft.trim();
    if (trimmed === currentUsername) return;
    setUsernameLoading(true);
    try {
      const data = await authRequest("/auth/change-username", "POST", { newUsername: trimmed }, load(LS.sessionToken, null));
      save(LS.currentUsername, data.username);
      setCurrentUsername(data.username);
      setUsernameMsg({ ok: true, text: "Username updated." });
      refreshSessionInfo();
    } catch (err) {
      setUsernameMsg({ ok: false, text: err.message });
    } finally {
      setUsernameLoading(false);
    }
  };
  const themeSwatches = [
    { id: "light", label: "Light", bg: "#f4f6f8", surface: "#ffffff", accent: "#10b981" },
    { id: "dark", label: "GitHub Dark", bg: "#0d1117", surface: "#11161f", accent: "#10b981" },
    { id: "dracula", label: "Dracula", bg: "#282a36", surface: "#2f3244", accent: "#ff79c6" },
    { id: "cyberpunk", label: "Cyberpunk", bg: "#0b0b0f", surface: "#131318", accent: "#05e0f2" },
    { id: "nord", label: "Nord", bg: "#2e3440", surface: "#3b4252", accent: "#88c0d0" },
  ];

  useEffect(() => { setDraft(providerKeys[provider] || ""); setShowKey(false); }, [provider]);

  const [relayStatus, setRelayStatus] = useState("checking");
  useEffect(() => {
    if (!PROVIDERS[provider].needsProxy) return;
    let cancelled = false;
    setRelayStatus("checking");
    fetch(OPENAI_PROXY_URL, { method: "OPTIONS" })
      .then((res) => { if (!cancelled) setRelayStatus(res.ok || res.status === 204 ? "up" : "down"); })
      .catch(() => { if (!cancelled) setRelayStatus("down"); });
    return () => { cancelled = true; };
  }, [provider]);

  return (
    <div className="max-w-3xl mx-auto px-4 sm:px-8 py-6 sm:py-10">
      <header className="mb-8">
        <p className="text-xs uppercase tracking-[0.2em] text-[color:var(--accent-text)] mb-1">Settings</p>
        <h2 className="text-2xl font-semibold text-[color:var(--text)]">API & appearance</h2>
      </header>

      <section className="rounded-xl bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] p-6 mb-6">
        <h3 className="text-sm font-semibold text-[color:var(--text)] mb-4 flex items-center gap-2">
          <Key size={15} className="text-[color:var(--accent-text)]" /> API Settings
        </h3>

        <label className="block text-xs text-[color:var(--text-dim)] mb-2">AI provider</label>
        <div className="grid grid-cols-3 gap-2 mb-5">
          {Object.entries(PROVIDERS).map(([id, p]) => (
            <button key={id} onClick={() => setProvider(id)}

              {p.free && <span className="absolute top-1.5 right-1.5 text-[9px] uppercase tracking-wide px-1.5 py-0.5 rounded-full bg-accent-500/20 text-[color:var(--accent-text)]">Free</span>}
              <p className={`text-sm font-medium ${provider === id ? "text-[color:var(--accent-text)]" : "text-[color:var(--text)]"}`}>{p.short}</p>
              <p className="text-[10px] text-[color:var(--text-faint)] mt-0.5">{providerKeys[id] ? "Key saved" : "No key yet"}</p>
            </button>
          ))}
        </div>

        <label className="block text-xs text-[color:var(--text-dim)] mb-1.5">{info.label} API key</label>
        <div className="flex gap-2 mb-2">
          <div className="relative flex-1">

const VOCAB_TEST_TIME_LIMIT = 8;
const VOCAB_TEST_WARMUP_QUESTIONS = 6;
const VOCAB_TEST_MAX_QUESTIONS = 22;
const VOCAB_TEST_FAKE_EVERY = 4;
const VOCAB_TEST_REVEAL_MS = 1100;
const VOCAB_TEST_MAX_POOL = VOCAB_TEST_TIERS[VOCAB_TEST_TIERS.length - 1].pool;

// Adaptive reading-vocabulary test, in two stages:
//  1) Warm-up — plain Know/Don't-know questions starting at the easiest tier,
//     climbing a tier on every "know" to quickly locate a rough starting level.
//  2) Adaptive multiple choice — the written word plus 4 definitions, a 5th
//     "none of these" option (the real definition is sometimes deliberately
//     left out), and a separate honest "I don't know" bail-out. Climbs a tier
//     on a correct answer, drops on a wrong one, a timeout, or "I don't know".
// Both stages periodically slip in an invented non-word (no real definition)
// to catch over-claiming; picking a specific definition for one counts as a
// false positive and discounts the final estimate.
function estimateVocabScore(hist, fStats) {
  let estimate = 0, prevPool = 0, reachedAny = false, level = null;
  VOCAB_TEST_TIERS.forEach((tier) => {
    const h = hist[tier.id];
    const delta = tier.pool - prevPool;
    let acc;
    if (h && h.asked > 0) { acc = h.correct / h.asked; reachedAny = true; if (acc >= 0.5) level = tier; }
    else { acc = reachedAny ? 0 : 1; }
    estimate += delta * acc;
    prevPool = tier.pool;
  });
  // Smoothed so a single early false-positive (very small sample) can't wipe out
  // the whole estimate — the penalty only approaches the raw rate as more
  // control words accumulate, and is capped well short of 100%.
  const smoothedFakeRate = fStats.asked ? fStats.falsePositive / (fStats.asked + 2) : 0;
  const penalty = Math.min(0.6, smoothedFakeRate);
  return { estimate: Math.max(0, Math.round(estimate * (1 - penalty))), level };
}

function genWarmupQuestion(tierIdx, usedMap, isZh) {
  const tier = VOCAB_TEST_TIERS[tierIdx];
  const usedWords = usedMap[tier.id] || [];
  const avail = tier.words.filter((w) => !usedWords.includes(w.w));
  const pool = avail.length ? avail : tier.words;
  const word = pool[Math.floor(Math.random() * pool.length)];
  const defOf = (item) => (isZh ? item.zh : item.en);
  return { type: "warmup", isFake: false, tierIdx, tierId: tier.id, word: word.w, trueDef: defOf(word) };
}

function genWarmupFake(usedFakes) {
  const avail = VOCAB_TEST_FAKES.filter((w) => !usedFakes.includes(w));
  const pool = avail.length ? avail : VOCAB_TEST_FAKES;
  return { type: "warmup", isFake: true, word: pool[Math.floor(Math.random() * pool.length)], trueDef: null };
}

function genMCReal(tierIdx, isZh, usedMap) {
  const tier = VOCAB_TEST_TIERS[tierIdx];
  const usedWords = usedMap[tier.id] || [];
  const avail = tier.words.filter((w) => !usedWords.includes(w.w));
  const pool = avail.length ? avail : tier.words;
  const word = pool[Math.floor(Math.random() * pool.length)];
  let distractorSource = tier.words.filter((w) => w.w !== word.w);
  if (distractorSource.length < 4) {
    const neighborIdx = tierIdx + 1 < VOCAB_TEST_TIERS.length ? tierIdx + 1 : tierIdx - 1;
    distractorSource = distractorSource.concat(VOCAB_TEST_TIERS[neighborIdx]?.words || []);
  }
  const distractors = [...distractorSource].sort(() => Math.random() - 0.5).slice(0, 4);
  const defOf = (item) => (isZh ? item.zh : item.en);
  const hideCorrect = Math.random() < 0.3;
  let choices, correctChoiceIndex;
  if (hideCorrect) {
    choices = distractors.map(defOf);
    correctChoiceIndex = null;
  } else {
    const combined = [defOf(word), ...distractors.slice(0, 3).map(defOf)];
    const order = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
    choices = order.map((i) => combined[i]);
    correctChoiceIndex = order.indexOf(0);
  }
  return { type: "mc", isFake: false, tierIdx, tierId: tier.id, word: word.w, trueDef: defOf(word), choices, correctChoiceIndex };
}

function genMCFake(usedFakes, tierIdxForDistractors, isZh) {
  const avail = VOCAB_TEST_FAKES.filter((w) => !usedFakes.includes(w));
  const pool = avail.length ? avail : VOCAB_TEST_FAKES;
  const word = pool[Math.floor(Math.random() * pool.length)];
  const tier = VOCAB_TEST_TIERS[tierIdxForDistractors];
  const defOf = (item) => (isZh ? item.zh : item.en);
  const choices = [...tier.words].sort(() => Math.random() - 0.5).slice(0, 4).map(defOf);
  return { type: "mc", isFake: true, word, trueDef: null, choices, correctChoiceIndex: null };
}

function genQuestion(phase, tierIdx, usedMap, usedFakes, isZh, isFakeSlot) {
  if (phase === "warmup") return isFakeSlot ? genWarmupFake(usedFakes) : genWarmupQuestion(tierIdx, usedMap, isZh);
  return isFakeSlot ? genMCFake(usedFakes, tierIdx, isZh) : genMCReal(tierIdx, isZh, usedMap);
}

function VocabSizeTest({ uiLang, onDone, onClose, setVocabTestResult, onCreateList }) {
  const isZh = uiLang === "zh";
  const noneLabel = isZh ? "以上都不是" : "None of these";
  const idkLabel = isZh ? "我不知道" : "I don't know";
  const [selectedTopic, setSelectedTopic] = useState("mixed");
  const [listBuilt, setListBuilt] = useState(false);

  const [phase, setPhase] = useState("warmup");
  const [tierIdx, setTierIdx] = useState(0);
  const [used, setUsed] = useState({});
  const [usedFakes, setUsedFakes] = useState([]);
  const [history, setHistory] = useState({});
  const [fakeStats, setFakeStats] = useState({ asked: 0, falsePositive: 0 });
  const [qIndex, setQIndex] = useState(0);
  const [current, setCurrent] = useState(() => genQuestion("warmup", 0, {}, [], isZh, false));
  const [timeLeft, setTimeLeft] = useState(VOCAB_TEST_TIME_LIMIT);
  const [revealed, setRevealed] = useState(null);
  const [result, setResult] = useState(null);
  const commitRef = useRef(null);

  const hasData = Object.keys(history).length > 0;
  const liveScore = useMemo(() => estimateVocabScore(history, fakeStats), [history, fakeStats]);

  useEffect(() => {
    if (!current || revealed || result !== null) return;
    if (timeLeft <= 0) { submitAnswer(null); return; }
    const id = setTimeout(() => setTimeLeft((t) => t - 1), 1000);
    return () => clearTimeout(id);
  }, [current, timeLeft, revealed, result]);

  const finish = (hist, fStats) => {
    const { estimate, level } = estimateVocabScore(hist, fStats);
    setResult({ estimate, level });
    setVocabTestResult(() => estimate);
  };

  const proceed = (nextPhase, nextTierIdx, usedMap, usedFakesList, fStats, hist, newQIndex) => {
    setPhase(nextPhase);
    setQIndex(newQIndex);
    setTimeLeft(VOCAB_TEST_TIME_LIMIT);
    if (newQIndex >= VOCAB_TEST_MAX_QUESTIONS) { finish(hist, fStats); return; }
    const isFakeSlot = newQIndex > 0 && newQIndex % VOCAB_TEST_FAKE_EVERY === 0;
    setCurrent(genQuestion(nextPhase, nextTierIdx, usedMap, usedFakesList, isZh, isFakeSlot));
  };

  const submitAnswer = (answer) => {
    if (!current || revealed || result !== null) return;
    const newQIndex = qIndex + 1;
    const nextPhase = newQIndex >= VOCAB_TEST_WARMUP_QUESTIONS ? "mc" : phase;

    if (phase === "warmup") {
      if (current.isFake) {
        const claimedKnowledge = answer === true;
        const newFakeStats = { asked: fakeStats.asked + 1, falsePositive: fakeStats.falsePositive + (claimedKnowledge ? 1 : 0) };
        const newUsedFakes = [...usedFakes, current.word];
        setFakeStats(newFakeStats);
        setUsedFakes(newUsedFakes);
        proceed(nextPhase, tierIdx, used, newUsedFakes, newFakeStats, history, newQIndex);
        return;
      }
      const claimedKnow = answer === true;
      const prevHist = history[current.tierId] || { asked: 0, correct: 0 };
      const newHistory = { ...history, [current.tierId]: { asked: prevHist.asked + 1, correct: prevHist.correct + (claimedKnow ? 1 : 0) } };
      const newUsed = { ...used, [current.tierId]: [...(used[current.tierId] || []), current.word] };
      const nextTier = claimedKnow ? Math.min(current.tierIdx + 1, VOCAB_TEST_TIERS.length - 1) : Math.max(current.tierIdx - 1, 0);
      setHistory(newHistory);
      setUsed(newUsed);
      setTierIdx(nextTier);
      proceed(nextPhase, nextTier, newUsed, usedFakes, fakeStats, newHistory, newQIndex);
      return;
    }

    // MC phase (real or fake word): reveal the correct choice inline, then auto-advance.
    let commit;
    if (current.isFake) {
      const claimedKnowledge = typeof answer === "number";
      const newFakeStats = { asked: fakeStats.asked + 1, falsePositive: fakeStats.falsePositive + (claimedKnowledge ? 1 : 0) };
      const newUsedFakes = [...usedFakes, current.word];
      commit = () => {
        setFakeStats(newFakeStats);
        setUsedFakes(newUsedFakes);
        proceed(nextPhase, tierIdx, used, newUsedFakes, newFakeStats, history, newQIndex);
      };
    } else {
      const correct = typeof answer === "number"
        ? current.correctChoiceIndex === answer
        : answer === "none" && current.correctChoiceIndex === null;
      const prevHist = history[current.tierId] || { asked: 0, correct: 0 };
      const newHistory = { ...history, [current.tierId]: { asked: prevHist.asked + 1, correct: prevHist.correct + (correct ? 1 : 0) } };
      const newUsed = { ...used, [current.tierId]: [...(used[current.tierId] || []), current.word] };
      const nextTier = correct ? Math.min(current.tierIdx + 1, VOCAB_TEST_TIERS.length - 1) : Math.max(current.tierIdx - 1, 0);
      commit = () => {
        setHistory(newHistory);
        setUsed(newUsed);
        setTierIdx(nextTier);
        proceed("mc", nextTier, newUsed, usedFakes, fakeStats, newHistory, newQIndex);
      };
    }
    setRevealed({ chosenAnswer: answer });
    commitRef.current = commit;
    setTimeout(() => {
      if (commitRef.current !== commit) return;
      commitRef.current = null;
      setRevealed(null);
      commit();
    }, VOCAB_TEST_REVEAL_MS);
  };
