function MemorizeSession({ list, pool, updateList, setStats, registerActivity, onOpenDetail, onExit, setView }) {
  const [subPhase, setSubPhase] = useState("session");
  const [data, setData] = useState(() => {
    const obj = {};
    pool.forEach((w) => { obj[w.id] = { memRate: w.memRate || 0, memStarted: !!w.memStarted, done: (w.memRate || 0) >= 100 }; });
    return obj;
  });
  const pick = (avoidId, snapshot) => {
    const remaining = pool.filter((w) => !snapshot[w.id].done);
    if (!remaining.length) return null;
    const candidates = remaining.length > 1 ? remaining.filter((w) => w.id !== avoidId) : remaining;
    const source = candidates.length ? candidates : remaining;
    const weights = source.map((w) => Math.max(5, 100 - snapshot[w.id].memRate));
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < source.length; i++) {
      r -= weights[i];
      if (r <= 0) return source[i].id;
    }
    return source[source.length - 1].id;
  };
  const [currentId, setCurrentId] = useState(() => pick(null, data));
  const [showDetails, setShowDetails] = useState(false);

  const finishSession = (finalData) => {
    const today = todayStr();
    let newlyIntroduced = 0;
    updateList(list.id, (l) => ({
      ...l,
      words: l.words.map((w) => {
        const d = finalData[w.id];
        if (!d) return w;
        if (!w.seen) newlyIntroduced++;
        const boxBump = Math.min(6, (w.box || 0) + 1);
        return { ...w, seen: true, learnedOn: w.learnedOn || today, box: boxBump,
          due: addDays(today, LEITNER_DAYS[Math.min(boxBump, LEITNER_DAYS.length - 1)]), memRate: 100, memStarted: true };
      }),
    }));
    if (newlyIntroduced > 0) {
      setStats((s) => ({ ...s, dailyLearned: { ...(s.dailyLearned || {}), [today]: ((s.dailyLearned || {})[today] || 0) + newlyIntroduced } }));
    }
    registerActivity();
    setSubPhase("summary");
  };

  const rate = (rating) => {
    const cur = data[currentId];
    let nextRate;
    if (!cur.memStarted) {
      nextRate = rating === "know" ? 100 : rating === "blurry" ? 20 : 0;
    } else {
      nextRate = rating === "know" ? Math.min(100, cur.memRate + 20) : rating === "blurry" ? Math.min(100, cur.memRate + 10) : cur.memRate;
    }
    const updated = { ...data, [currentId]: { memRate: nextRate, memStarted: true, done: nextRate >= 100 } };
    setData(updated);
    setShowDetails(false);
    const nextId = pick(currentId, updated);
    if (nextId) setCurrentId(nextId);
    else finishSession(updated);
  };

  if (subPhase === "summary") {
    return (
      <div className="max-w-2xl mx-auto px-4 sm:px-8 py-6 sm:py-10 relative animate-fade-up">
        <Confetti />
        <Trophy size={32} className="text-amber-500 dark:text-amber-300 mb-4 animate-pop" />
        <p className="text-xs uppercase tracking-[0.2em] text-[color:var(--accent-text)] mb-1">学 · Fully memorized</p>
        <h2 className="text-2xl font-semibold text-[color:var(--text)] mb-2">All {pool.length} word{pool.length === 1 ? "" : "s"} reached 100%</h2>
        <p className="text-sm text-[color:var(--text-dim)] mb-6">Tap any word for its full page — definition, examples, and collocations.</p>

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-8">
          {pool.map((w) => (
            <button key={w.id} onClick={() => onOpenDetail(list.id, w.id)}
              className="text-left rounded-xl bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] p-4 hover:ring-emerald-500/40 transition">
              <div className="flex items-center gap-2 mb-1">
                <span className="text-lg">{VIBE_EMOJI[w.vibe] || "✨"}</span>
                <span className="text-sm font-semibold text-[color:var(--text)]">{w.word}</span>
              </div>
              <p className="text-xs text-[color:var(--text-dim)] truncate">{w.def}</p>
            </button>
          ))}
        </div>

        <div className="flex gap-3">
          <button onClick={() => setView("quiz")}
            className="flex-1 flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-lg bg-gradient-to-r from-emerald-500 to-teal-500 text-[#0a0e14] font-semibold hover:from-emerald-400 hover:to-teal-400 transition">
            <Zap size={15} /> Test these words now
          </button>
          <button onClick={onExit}
            className="px-4 py-2.5 rounded-lg bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] text-[color:var(--text)] text-sm font-medium hover:ring-emerald-500/40 transition">
            Back to Learn
          </button>
        </div>
      </div>
    );
  }

  const word = pool.find((w) => w.id === currentId);
  if (!word) {
    return (
      <div className="max-w-2xl mx-auto px-4 sm:px-8 py-10 sm:py-16 text-center">
        <p className="text-sm text-[color:var(--text-dim)] mb-4">Nothing left to memorize in this batch right now.</p>
        <button onClick={onExit} className="px-4 py-2 rounded-lg bg-emerald-500 text-[#0a0e14] text-sm font-medium hover:bg-emerald-400">Back to Learn</button>
      </div>
    );
  }
  const cur = data[currentId];
  const doneCount = Object.values(data).filter((d) => d.done).length;
  const coll = (word.coll || "").split(",").map((c) => c.trim()).filter(Boolean);
  const examples = buildExamples(word);

  const previewRate = (rating) => {
    if (!cur.memStarted) return rating === "know" ? 100 : rating === "blurry" ? 20 : 0;
    return rating === "know" ? Math.min(100, cur.memRate + 20) : rating === "blurry" ? Math.min(100, cur.memRate + 10) : cur.memRate;
  };
  const highlightWord = (sentence) => {
    const re = new RegExp(`(${word.word})`, "i");
    const parts = sentence.split(re);
    return parts.map((p, i) => re.test(p) && p.toLowerCase() === word.word.toLowerCase()
      ? <span key={i} className="text-[color:var(--accent-text)] font-semibold">{p}</span>
      : <span key={i}>{p}</span>);
  };

  return (
    <div className="max-w-2xl mx-auto px-4 sm:px-8 py-6 sm:py-10">
      <div className="flex items-center justify-between mb-6">
        <p className="text-xs uppercase tracking-[0.2em] text-[color:var(--accent-text)]">学 · Deep Memorize</p>
        <p className="text-xs text-[color:var(--text-faint)]">{doneCount}/{pool.length} at 100%</p>
      </div>
      <div className="h-1.5 rounded-full bg-[color:var(--surface2)] mb-8 overflow-hidden">
        <div className="h-full bg-emerald-500 transition-all" style={{ width: `${(doneCount / pool.length) * 100}%` }} />
      </div>

      <div className="rounded-2xl overflow-hidden bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] min-h-[360px] flex flex-col">
        <div className="px-8 py-7 bg-gradient-to-br from-teal-500/25 via-emerald-500/15 to-transparent border-b border-[color:var(--border)]">
          <div className="flex items-center justify-between mb-3">
            <span className="text-2xl">{VIBE_EMOJI[word.vibe] || "✨"}</span>
            <span className="text-[11px] font-medium px-2.5 py-1 rounded-full bg-black/10 dark:bg-white/10 text-[color:var(--text)]">{cur.memRate}% memorized</span>
          </div>
          <h3 className="text-4xl sm:text-5xl font-bold text-[color:var(--text)] tracking-tight">{word.word}</h3>
          <p className="text-xs uppercase tracking-widest text-[color:var(--text-faint)] mt-1">{word.vibe}</p>
        </div>

        <div className="flex-1 flex flex-col justify-center px-8 py-6">
          {!showDetails ? (
            <div className="text-center py-6">
              <button onClick={() => setShowDetails(true)}
                className="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-emerald-500 text-[#0a0e14] text-sm font-semibold hover:bg-emerald-400 transition">
                <Sparkles size={14} /> Show definition & details
              </button>
            </div>
          ) : (
            <div className="text-left w-full space-y-4">
              <p className="text-base text-[color:var(--text)] leading-relaxed">{word.def}</p>
              {examples.length > 0 && (
                <div>
                  <p className="text-[10px] uppercase tracking-wide text-[color:var(--text-faint)] mb-1.5">Example</p>
                  <div className="space-y-1.5">
                    {examples.slice(0, 2).map((s, i) => (
                      <p key={i} className="text-sm text-[color:var(--text-dim)] italic leading-relaxed">{highlightWord(s)}</p>
                    ))}
                  </div>
                </div>
              )}
              {coll.length > 0 && (
                <div className="flex flex-wrap gap-2">
                  {coll.map((c, i) => <span key={i} className="text-xs px-2.5 py-1 rounded-full bg-emerald-500/15 text-[color:var(--accent-text)] ring-1 ring-emerald-500/30">{c}</span>)}
                </div>
              )}
            </div>
          )}
        </div>

        {showDetails && (
          <div className="px-8 pb-8">
            <p className="text-xs text-[color:var(--text-faint)] mb-2 text-center">
              {cur.memStarted ? "How well do you remember it now?" : "Did you already know this word?"}
            </p>
            <div className="flex gap-2">
              <button onClick={() => rate("forgot")}
                className="flex-1 py-2.5 rounded-lg text-sm font-medium ring-1 bg-rose-500/10 text-rose-700 dark:text-rose-300 ring-rose-500/30 hover:bg-rose-500/15 transition">
                <span className="block">I forgot</span>
                <span className="block text-[10px] opacity-70 mt-0.5">stays at {previewRate("forgot")}%</span>
              </button>
              <button onClick={() => rate("blurry")}
                className="flex-1 py-2.5 rounded-lg text-sm font-medium ring-1 bg-amber-500/10 text-amber-700 dark:text-amber-300 ring-amber-500/30 hover:bg-amber-500/15 transition">
                <span className="block">Blurry</span>
                <span className="block text-[10px] opacity-70 mt-0.5">→ {previewRate("blurry")}%</span>
              </button>
              <button onClick={() => rate("know")}
                className="flex-1 py-2.5 rounded-lg text-sm font-medium ring-1 bg-emerald-500/10 text-emerald-700 dark:text-emerald-300 ring-emerald-500/30 hover:bg-emerald-500/15 transition">
                <span className="block">I remember it</span>
                <span className="block text-[10px] opacity-70 mt-0.5">{previewRate("know") >= 100 ? "mastered!" : `→ ${previewRate("know")}%`}</span>
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const LEARN_MODES = [
  { id: "quick", label: "Quick Preview", desc: "Skim new words fast with rotating card styles." },
  { id: "deep", label: "Deep Memorize", desc: "Self-rate each word until it's fully memorized." },
];

function LearnView({ list, updateList, setStats, registerActivity, onOpenDetail, setView }) {
  const [phase, setPhase] = useState("home");
  const [mode, setMode] = useState(() => load(nsKey("learnMode"), "quick"));
  const [sessionPool, setSessionPool] = useState([]);
  const [memPool, setMemPool] = useState([]);
  const [idx, setIdx] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const [enabledStyles, setEnabledStyles] = useState(() => load(nsKey("learnStyles"), LEARN_STYLES.map((s) => s.id)));

  useEffect(() => save(nsKey("learnStyles"), enabledStyles), [enabledStyles]);
  useEffect(() => save(nsKey("learnMode"), mode), [mode]);

  const pending = useMemo(() => getLearnPool(list), [list]);
  const memPending = useMemo(() => getMemorizePool(list), [list]);
  const styles = enabledStyles.length ? enabledStyles : ["reveal"];

  const toggleStyle = (id) => {
    setEnabledStyles((cur) => {
      if (cur.includes(id)) {
        if (cur.length === 1) return cur;
        return cur.filter((s) => s !== id);
      }
      return [...cur, id];
    });
  };

  const start = () => {
    if (mode === "deep") {
      if (!memPending.length) return;
      setMemPool(memPending);
      setPhase("deep");
      return;
    }
    if (!pending.length) return;
    setSessionPool(pending);
    setIdx(0);
    setRevealed(false);
    setPhase("session");
  };

  const finish = (pool) => {
    const today = todayStr();
    updateList(list.id, (l) => ({
      ...l,
      words: l.words.map((w) => {
        if (!pool.some((p) => p.id === w.id)) return w;
        return { ...w, seen: true, box: 1, due: addDays(today, LEITNER_DAYS[1]), learnedOn: today };
      }),
    }));
    setStats((s) => ({ ...s, dailyLearned: { ...(s.dailyLearned || {}), [today]: ((s.dailyLearned || {})[today] || 0) + pool.length } }));
    registerActivity();
    setPhase("summary");
  };

  const next = () => {
    if (idx + 1 >= sessionPool.length) {
      finish(sessionPool);
    } else {
      setIdx(idx + 1);
      setRevealed(false);
    }
  };

  if (phase === "deep") {
    return (
      <MemorizeSession list={list} pool={memPool} updateList={updateList} setStats={setStats}
        registerActivity={registerActivity} onOpenDetail={onOpenDetail} setView={setView}
        onExit={() => setPhase("home")} />
    );
  }

  if (phase === "home") {
    const activePending = mode === "deep" ? memPending : pending;
    return (
      <div className="max-w-2xl mx-auto px-4 sm:px-8 py-10 sm:py-16 text-center">
        <GraduationCap size={36} className="mx-auto text-[color:var(--accent-text)] mb-4" />
        <p className="text-xs uppercase tracking-[0.2em] text-[color:var(--accent-text)] mb-1">学 · Learn</p>
        <h2 className="text-2xl font-semibold text-[color:var(--text)] mb-3">Ready to meet today's words?</h2>

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
          {LEARN_MODES.map((m) => (
            <button key={m.id} onClick={() => setMode(m.id)}

            </button>

        <p className="text-sm text-[color:var(--text-dim)] mb-8">
          {activePending.length
            ? mode === "deep"
              ? `${activePending.length} word${activePending.length === 1 ? "" : "s"} from "${list.name}" aren't fully memorized yet.`
              : `${activePending.length} new word${activePending.length === 1 ? "" : "s"} from "${list.name}". Pick how you want to see them below.`
            : mode === "deep"
              ? "Everything in this list is already memorized. Add more words, or check Quick Test for spaced review."
              : "No new words waiting right now. Add more to this list, or head to Quick Test to review what you've already learned."}
        </p>

        {mode === "quick" && (
          <div className="text-left rounded-xl bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] p-5 mb-8">
            <p className="text-xs uppercase tracking-wide text-[color:var(--text-faint)] mb-3">Learning styles</p>
            <div className="space-y-2">
              {LEARN_STYLES.map((s) => {
                const on = enabledStyles.includes(s.id);
                return (
                  <button key={s.id} onClick={() => toggleStyle(s.id)}
                    className={`w-full flex items-start gap-3 px-3 py-2.5 rounded-lg ring-1 text-left transition ${
                      on ? "bg-emerald-500/10 ring-emerald-500/40" : "ring-[color:var(--border)] hover:ring-emerald-500/20"}`}>
                    <div className={`mt-0.5 h-4 w-4 rounded flex items-center justify-center shrink-0 transition ${
                      on ? "bg-emerald-500" : "ring-1 ring-[color:var(--text-faint)]"}`}>
                      {on && <Check size={12} className="text-[#0a0e14]" strokeWidth={3} />}
                    </div>
                    <div>
                      <p className={`text-sm font-medium ${on ? "text-[color:var(--accent-text)]" : "text-[color:var(--text)]"}`}>{s.label}</p>
                      <p className="text-xs text-[color:var(--text-faint)] mt-0.5">{s.desc}</p>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {mode === "deep" && (
          <div className="text-left rounded-xl bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] p-5 mb-8">
            <p className="text-xs uppercase tracking-wide text-[color:var(--text-faint)] mb-2">How it works</p>
            <p className="text-xs text-[color:var(--text-dim)] leading-relaxed">
              Each word shows up alone first. Reveal the definition, examples, and collocations, then rate yourself. Words you forget come back around sooner; words you know keep climbing toward 100%. The session ends once every word in the batch hits 100%.
            </p>
          </div>
        )}

        <button onClick={start} disabled={!activePending.length}
          className="inline-flex items-center gap-2 px-6 py-3 rounded-lg bg-gradient-to-r from-emerald-500 to-teal-500 text-[#0a0e14] font-semibold hover:from-emerald-400 hover:to-teal-400 disabled:opacity-40 transition">
          <GraduationCap size={16} /> Start learning
        </button>
        {!activePending.length && (
          <div className="mt-4">
            <button onClick={() => setView("quiz")} className="text-sm text-[color:var(--accent-text)] hover:underline">Go review instead →</button>
          </div>
        )}
      </div>
    );
  }

  if (phase === "session") {
    const word = sessionPool[idx];
    const style = styles[idx % styles.length];
    return (
      <div className="max-w-2xl mx-auto px-4 sm:px-8 py-6 sm:py-10">
        <div className="flex items-center justify-between mb-6">
          <p className="text-xs uppercase tracking-[0.2em] text-[color:var(--accent-text)]">学 · Learning</p>
          <p className="text-xs text-[color:var(--text-faint)]">{idx + 1}/{sessionPool.length}</p>
        </div>
        <div className="h-1.5 rounded-full bg-[color:var(--surface2)] mb-8 overflow-hidden">
          <div className="h-full bg-emerald-500 transition-all" style={{ width: `${((idx + 1) / sessionPool.length) * 100}%` }} />
        </div>

        <div className="rounded-2xl bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] p-8 min-h-[280px] flex flex-col justify-between">
          <div>
            <span className="text-2xl">{VIBE_EMOJI[word.vibe] || "✨"}</span>
            <div className="mt-3">
              <LearnCard word={word} style={style} revealed={revealed} onReveal={() => setRevealed(true)} />
            </div>
          </div>
          {(style === "story" || revealed) && (
            <button onClick={next}
              className="mt-6 w-full flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-lg bg-emerald-500 text-[#0a0e14] text-sm font-semibold hover:bg-emerald-400 transition">
              {idx + 1 >= sessionPool.length ? "Finish" : "Got it — next"} <ChevronRight size={15} />
            </button>
          )}
        </div>
      </div>
    );
  }

  // phase === "summary"
  return (
    <div className="max-w-2xl mx-auto px-4 sm:px-8 py-6 sm:py-10 relative animate-fade-up">
      <Confetti />
      <Trophy size={32} className="text-amber-500 dark:text-amber-300 mb-4 animate-pop" />
      <p className="text-xs uppercase tracking-[0.2em] text-[color:var(--accent-text)] mb-1">学 · Nice work</p>
      <h2 className="text-2xl font-semibold text-[color:var(--text)] mb-2">You learned {sessionPool.length} new word{sessionPool.length === 1 ? "" : "s"} today</h2>
      <p className="text-sm text-[color:var(--text-dim)] mb-6">Tap any word for its full page — definition, examples, and collocations.</p>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-8">
        {sessionPool.map((w) => (
          <button key={w.id} onClick={() => onOpenDetail(list.id, w.id)}
            className="text-left rounded-xl bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] p-4 hover:ring-emerald-500/40 transition">
            <div className="flex items-center gap-2 mb-1">
              <span className="text-lg">{VIBE_EMOJI[w.vibe] || "✨"}</span>
              <span className="text-sm font-semibold text-[color:var(--text)]">{w.word}</span>
            </div>
            <p className="text-xs text-[color:var(--text-dim)] truncate">{w.def}</p>
          </button>
        ))}
      </div>

      <div className="flex gap-3">
        <button onClick={() => setView("quiz")}
          className="flex-1 flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-lg bg-gradient-to-r from-emerald-500 to-teal-500 text-[#0a0e14] font-semibold hover:from-emerald-400 hover:to-teal-400 transition">
          <Zap size={15} /> Test these words now
        </button>
        <button onClick={() => setView("dashboard")}
          className="px-4 py-2.5 rounded-lg bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] text-[color:var(--text)] text-sm font-medium hover:ring-emerald-500/40 transition">
          Back to dashboard
        </button>
      </div>
    </div>
  );
}

/* ---------------- Quick Test / Quiz ---------------- */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuestion(word, allWords, enabledTypes) {
  const others = allWords.filter((w) => w.word.toLowerCase() !== word.word.toLowerCase() && w.def);
  const canMcq = others.length >= 3;
  const allowed = (enabledTypes && enabledTypes.length ? enabledTypes : ["word2def", "def2word", "fill"])
    .filter((t) => canMcq || t === "fill");
  const types = allowed.length ? allowed : ["fill"];
  const type = types[Math.floor(Math.random() * types.length)];

  if (type === "word2def") {
    const distractors = shuffle(others).slice(0, 3).map((w) => w.def);
    return { type, word, choices: shuffle([word.def, ...distractors]), answer: word.def };
  }
  if (type === "def2word") {
    const distractors = shuffle(others).slice(0, 3).map((w) => w.word);
    return { type, word, choices: shuffle([word.word, ...distractors]), answer: word.word };
  }
  const coll = (word.coll || "").split(",").map((c) => c.trim()).filter(Boolean);
  const sentence = `As the report noted, the ____ approach proved essential — a ${word.vibe} choice that ${coll[0] ? `paired naturally with "${coll[0]}."` : "shaped the whole argument."}`;
  return { type, word, sentence, def: word.def, answer: word.word };
}

function QuizView({ list, allWords, updateList, setStats, registerActivity, onOpenDetail, setView }) {
  const [phase, setPhase] = useState("home");
  const [mode, setMode] = useState(() => load(nsKey("quizMode"), "adaptive"));
  const [enabledStyles, setEnabledStyles] = useState(() => load(nsKey("quizStyles"), QUIZ_STYLES.map((s) => s.id)));
  const [pool, setPool] = useState([]);
  const [memPool, setMemPool] = useState([]);
  const [sessionState, setSessionState] = useState({});
  const [current, setCurrent] = useState(null);
  const [question, setQuestion] = useState(null);
  const [chosen, setChosen] = useState(null);
  const [textAnswer, setTextAnswer] = useState("");
  const [feedback, setFeedback] = useState(null);

  useEffect(() => save(nsKey("quizMode"), mode), [mode]);
  useEffect(() => save(nsKey("quizStyles"), enabledStyles), [enabledStyles]);

  const todayPool = useMemo(() => getTodayPool(list), [list]);
  const reviewMemPool = useMemo(() => getReviewMemorizePool(list), [list]);

  const toggleStyle = (id) => {
    setEnabledStyles((cur) => {
      if (cur.includes(id)) {
        if (cur.length === 1) return cur;
        return cur.filter((s) => s !== id);
      }
      return [...cur, id];
    });
  };

  const pickNext = (poolArr, state, avoidId) => {
    const remaining = poolArr.filter((w) => !state[w.id]?.done);
    if (!remaining.length) return null;
    const candidates = remaining.length > 1 ? remaining.filter((w) => w.id !== avoidId) : remaining;
    const source = candidates.length ? candidates : remaining;
    const weights = source.map((w) => 1 + (state[w.id]?.wrong || 0) * 3);
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < source.length; i++) {
      r -= weights[i];
      if (r <= 0) return source[i];
    }
    return source[source.length - 1];
  };

  const start = () => {
    if (mode === "deep") {
      if (!reviewMemPool.length) return;
      setMemPool(reviewMemPool);
      setPhase("deep");
      return;
    }
    if (!todayPool.length) return;
    const initState = {};
    todayPool.forEach((w) => { initState[w.id] = { wrong: 0, done: false }; });
    setSessionState(initState);
    setPool(todayPool);
    const first = pickNext(todayPool, initState, null);
    setCurrent(first);
    setQuestion(buildQuestion(first, allWords, enabledStyles));
    setChosen(null); setTextAnswer(""); setFeedback(null);
    setPhase("quiz");
  };

  const submit = (answerGiven) => {
    if (feedback) return;
    const correct = question.type === "fill"
      ? answerGiven.trim().toLowerCase() === question.answer.toLowerCase()
      : answerGiven === question.answer;
    setFeedback({ correct, answer: question.answer });
    setSessionState((s) => {
      const prev = s[current.id] || { wrong: 0, done: false };
      return { ...s, [current.id]: correct ? { ...prev, done: true } : { ...prev, wrong: prev.wrong + 1 } };
    });
  };

  const next = () => {
    setSessionState((s) => {
      const nextWord = pickNext(pool, s, current.id);
      if (!nextWord) {
        setPhase("recap");
      } else {
        setCurrent(nextWord);
        setQuestion(buildQuestion(nextWord, allWords, enabledStyles));
      }
      return s;
    });
    setChosen(null); setTextAnswer(""); setFeedback(null);
  };

  const finishSession = () => {
    const today = todayStr();
    let newlyIntroduced = 0;
    updateList(list.id, (l) => ({
      ...l,
      words: l.words.map((w) => {
        const st = sessionState[w.id];
        if (!st) return w;
        if (!w.seen) newlyIntroduced++;
        const struggled = st.wrong > 0;
        const newBox = struggled ? Math.max(1, w.box || 1) : Math.min(6, (w.box || 0) + 1);
        return { ...w, seen: true, learnedOn: w.learnedOn || today, box: newBox, due: addDays(today, LEITNER_DAYS[Math.min(newBox, LEITNER_DAYS.length - 1)]),
          wrongCount: w.wrongCount + st.wrong, correctCount: w.correctCount + (struggled ? 0 : 1) };
      }),
    }));
    setStats((s) => ({ ...s, sessions: s.sessions + 1, dailyLearned: { ...(s.dailyLearned || {}), [today]: ((s.dailyLearned || {})[today] || 0) + newlyIntroduced } }));
    registerActivity();
    setPhase("done");
  };

  if (phase === "deep") {
    return (
      <MemorizeSession list={list} pool={memPool} updateList={updateList} setStats={setStats}
        registerActivity={registerActivity} onOpenDetail={onOpenDetail} setView={setView}
        onExit={() => setPhase("home")} />
    );
  }

  if (phase === "home") {
    const activePending = mode === "deep" ? reviewMemPool : todayPool;
    return (
      <div className="max-w-2xl mx-auto px-4 sm:px-8 py-10 sm:py-16 text-center animate-fade-up">
        <Zap size={36} className="mx-auto text-[color:var(--accent-text)] mb-4" />
        <p className="text-xs uppercase tracking-[0.2em] text-[color:var(--accent-text)] mb-1">测 · Quick Test</p>
        <h2 className="text-2xl font-semibold text-[color:var(--text)] mb-3">Ready to review today's words?</h2>

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
          {QUIZ_MODES.map((m) => (
            <button key={m.id} onClick={() => setMode(m.id)}
              className={`text-left rounded-xl ring-1 p-4 transition ${
                mode === m.id ? "bg-emerald-500/10 ring-emerald-500/40" : "bg-[color:var(--surface)] ring-[color:var(--border)] hover:ring-emerald-500/20"}`}>
              <p className={`text-sm font-semibold ${mode === m.id ? "text-[color:var(--accent-text)]" : "text-[color:var(--text)]"}`}>{m.label}</p>
              <p className="text-xs text-[color:var(--text-faint)] mt-1">{m.desc}</p>
            </button>
          ))}
        </div>

        <p className="text-sm text-[color:var(--text-dim)] mb-8">
          {activePending.length
            ? `${activePending.length} word${activePending.length === 1 ? "" : "s"} queued from "${list.name}". ${mode === "deep" ? "You'll self-rate each one until it's back to 100%." : "Words you miss will come back around more often."}`
            : "Nothing queued right now — add words to this list or check back tomorrow."}
        </p>

        {mode === "adaptive" && (
          <div className="text-left rounded-xl bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] p-5 mb-8">
            <p className="text-xs uppercase tracking-wide text-[color:var(--text-faint)] mb-3">Review styles</p>
            <div className="space-y-2">
              {QUIZ_STYLES.map((s) => {
                const on = enabledStyles.includes(s.id);
                return (
                  <button key={s.id} onClick={() => toggleStyle(s.id)}
                    className={`w-full flex items-start gap-3 px-3 py-2.5 rounded-lg ring-1 text-left transition ${
                      on ? "bg-emerald-500/10 ring-emerald-500/40" : "ring-[color:var(--border)] hover:ring-emerald-500/20"}`}>
                    <div className={`mt-0.5 h-4 w-4 rounded flex items-center justify-center shrink-0 transition ${
                      on ? "bg-emerald-500" : "ring-1 ring-[color:var(--text-faint)]"}`}>
                      {on && <Check size={12} className="text-[#0a0e14]" strokeWidth={3} />}
                    </div>
                    <div>
                      <p className={`text-sm font-medium ${on ? "text-[color:var(--accent-text)]" : "text-[color:var(--text)]"}`}>{s.label}</p>
                      <p className="text-xs text-[color:var(--text-faint)] mt-0.5">{s.desc}</p>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        )}

        <button onClick={start} disabled={!activePending.length}
          className="btn-pulse inline-flex items-center gap-2 px-6 py-3 rounded-lg bg-gradient-to-r from-emerald-500 to-teal-500 text-[#0a0e14] font-semibold hover:from-emerald-400 hover:to-teal-400 disabled:opacity-40 disabled:animate-none transition">
          <Sparkles size={16} /> {mode === "deep" ? "Start deep review" : "Start quick test"}
        </button>
      </div>
    );
  }

  if (phase === "quiz" && current) {
    const doneCount = Object.values(sessionState).filter((s) => s.done).length;
    return (
      <div className="max-w-2xl mx-auto px-4 sm:px-8 py-6 sm:py-10">
        <div className="flex items-center justify-between mb-6">
          <p className="text-xs uppercase tracking-[0.2em] text-[color:var(--accent-text)]">测 · Quick Test</p>
          <p className="text-xs text-[color:var(--text-faint)]">{doneCount}/{pool.length} mastered this round</p>
        </div>
        <div className="h-1.5 rounded-full bg-[color:var(--surface2)] mb-8 overflow-hidden">
          <div className="h-full bg-emerald-500 transition-all" style={{ width: `${(doneCount / pool.length) * 100}%` }} />
        </div>

        <div key={current.id + question.type} className="rounded-2xl bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] p-8 animate-fade-up">
          <span className="text-2xl">{VIBE_EMOJI[current.vibe] || "✨"}</span>

          {question.type === "word2def" && (
            <>
              <p className="text-xs uppercase tracking-wide text-[color:var(--text-faint)] mt-3 mb-2">What does this word mean?</p>
              <h3 className="text-3xl font-bold text-[color:var(--text)] mb-6">{current.word}</h3>
              <div className="space-y-2">
                {question.choices.map((c, i) => (
                  <ChoiceButton key={i} label={c} selected={chosen === c} feedback={feedback} isAnswer={c === question.answer}
                    onClick={() => !feedback && setChosen(c)} />
                ))}
              </div>
            </>
          )}

          {question.type === "def2word" && (
            <>
              <p className="text-xs uppercase tracking-wide text-[color:var(--text-faint)] mt-3 mb-2">Which word matches this definition?</p>
              <h3 className="text-lg font-medium text-[color:var(--text)] mb-6 leading-relaxed">{current.def}</h3>
              <div className="space-y-2">
                {question.choices.map((c, i) => (
                  <ChoiceButton key={i} label={c} selected={chosen === c} feedback={feedback} isAnswer={c === question.answer}
                    onClick={() => !feedback && setChosen(c)} />
                ))}
              </div>
            </>
          )}

          {(question.type === "word2def" || question.type === "def2word") && !feedback && (
            <button onClick={() => submit(chosen)} disabled={chosen === null}
              className="mt-4 w-full flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-lg bg-emerald-500 text-[#0a0e14] text-sm font-semibold hover:bg-emerald-400 disabled:opacity-40 transition">
              <Check size={15} /> Submit answer
            </button>
          )}

          {question.type === "fill" && (
            <>
              <p className="text-xs uppercase tracking-wide text-[color:var(--text-faint)] mt-3 mb-2">Fill in the blank</p>
              <p className="text-lg text-[color:var(--text)] mb-2 leading-relaxed">{question.sentence}</p>
              <p className="text-xs text-[color:var(--text-faint)] mb-4">Hint: {question.def}</p>
              <input value={textAnswer} onChange={(e) => setTextAnswer(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && textAnswer.trim() && submit(textAnswer)}
                disabled={!!feedback} placeholder="Type the word…"
                className="w-full bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] rounded-lg px-3 py-2.5 text-sm text-[color:var(--text)] focus:outline-none focus:ring-emerald-500/50" />
              {!feedback && (
                <button onClick={() => submit(textAnswer)} disabled={!textAnswer.trim()}
                  className="mt-3 px-4 py-2 rounded-lg bg-emerald-500 text-[#0a0e14] text-sm font-medium hover:bg-emerald-400 disabled:opacity-40 transition">
                  Submit answer
                </button>
              )}
              {feedback && (
                <p className={`mt-3 text-sm ${feedback.correct ? "text-emerald-700 dark:text-emerald-300" : "text-rose-700 dark:text-rose-300"}`}>
                  {feedback.correct ? "Correct!" : `Not quite — the answer is "${feedback.answer}".`}
                </p>
              )}
            </>
          )}

          {feedback && (
            <button onClick={next} className="mt-6 w-full flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-lg bg-[color:var(--surface2)] ring-1 ring-[color:var(--border)] text-[color:var(--text)] text-sm font-medium hover:ring-emerald-500/40 transition">
              Next <ChevronRight size={15} />
            </button>
          )}
        </div>
      </div>
    );
  }

  if (phase === "recap") {
    return (
      <div className="max-w-2xl mx-auto px-4 sm:px-8 py-6 sm:py-10 animate-fade-up">
        <p className="text-xs uppercase tracking-[0.2em] text-[color:var(--accent-text)] mb-1">测 · Recap</p>
        <h2 className="text-2xl font-semibold text-[color:var(--text)] mb-2">Nice work — here's everything you covered</h2>
        <p className="text-sm text-[color:var(--text-dim)] mb-6">Take one more look at the definitions before you save this round.</p>
        <div className="space-y-2 mb-8">
          {pool.map((w) => {
            const st = sessionState[w.id];
            const nailed = st && st.wrong === 0;
            return (
              <div key={w.id} className="rounded-xl bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] px-5 py-4">
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-base font-semibold text-[color:var(--text)]">{w.word}</span>
                  <span className={`text-[10px] uppercase tracking-wide px-2 py-0.5 rounded-full ${nailed ? "bg-emerald-500/15 text-[color:var(--accent-text)]" : "bg-amber-500/15 text-amber-700 dark:text-amber-300"}`}>
                    {nailed ? "nailed it" : "needs practice"}
                  </span>
                </div>
                <p className="text-sm text-[color:var(--text-dim)]">{w.def}</p>
              </div>
            );
          })}
        </div>
        <button onClick={finishSession}
          className="w-full flex items-center justify-center gap-1.5 px-4 py-3 rounded-lg bg-gradient-to-r from-emerald-500 to-teal-500 text-[#0a0e14] font-semibold hover:from-emerald-400 hover:to-teal-400 transition">
          <Check size={16} /> Save & finish
        </button>
      </div>
    );
  }

  if (phase === "done") {
    return (
      <div className="max-w-md mx-auto px-4 sm:px-8 py-16 sm:py-24 text-center relative animate-fade-up">
        <Confetti />
        <Trophy size={40} className="mx-auto text-amber-500 dark:text-amber-300 mb-4 animate-pop" />
        <h2 className="text-2xl font-semibold text-[color:var(--text)] mb-2">Session saved!</h2>
        <p className="text-sm text-[color:var(--text-dim)] mb-8">Your progress on these words has been updated. Come back tomorrow for the next round.</p>
        <button onClick={() => setPhase("home")}
          className="px-5 py-2.5 rounded-lg bg-emerald-500 text-[#0a0e14] text-sm font-medium hover:bg-emerald-400 transition">
          Back to test menu
        </button>
      </div>
    );
  }

  return null;
}

function ChoiceButton({ label, selected, feedback, isAnswer, onClick }) {
  let style = "ring-[color:var(--border)] text-[color:var(--text)] hover:ring-emerald-500/40";
  if (feedback) {
    if (isAnswer) style = "ring-emerald-500/50 bg-emerald-500/15 text-[color:var(--accent-text)]";
    else if (selected) style = "ring-rose-500/50 bg-rose-500/15 text-rose-700 dark:text-rose-300";
    else style = "ring-[color:var(--border)] text-[color:var(--text-faint)] opacity-60";
  } else if (selected) {
    style = "ring-emerald-500/50 bg-emerald-500/10 text-[color:var(--text)]";
  }
  return (
    <button onClick={onClick} disabled={!!feedback}
      className={`w-full text-left px-4 py-3 rounded-lg ring-1 text-sm transition-all duration-150 ${style}`}>
      {label}
    </button>
  );
}

/* ---------------- Dictionary Search ---------------- */
function SearchView({ activeList, updateList, apiKey, model, provider, onOpenDetail }) {
  const [query, setQuery] = useState("");
  const [suggestions, setSuggestions] = useState([]);
  const [showSuggestions, setShowSuggestions] = useState(false);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [recent, setRecent] = useState(() => load(nsKey("recentSearches"), []));
  const [added, setAdded] = useState(false);
  const debounceRef = useRef(null);

  useEffect(() => save(nsKey("recentSearches"), recent), [recent]);

  useEffect(() => {
    if (debounceRef.current) clearTimeout(debounceRef.current);
    const q = query.trim();
    if (q.length < 2) { setSuggestions([]); return; }
    debounceRef.current = setTimeout(() => {
      fetchSuggestions(q).then((s) => setSuggestions(s)).catch(() => setSuggestions([]));
    }, 220);
    return () => clearTimeout(debounceRef.current);
  }, [query]);

  const runSearch = async (word) => {
    const w = word.trim();
    if (!w) return;
    setShowSuggestions(false);
    setLoading(true); setError(null); setResult(null); setAdded(false);
    try {
      const found = await searchDictionary(w, apiKey, model, provider);
      if (!found) {
        setError(apiKey
          ? "Couldn't find a definition for that word."
          : "Couldn't find that word in the free dictionary — add an API key in Settings for AI-powered lookup on rarer words.");
        return;
      }
      setResult(found);
      setQuery(w);
      setRecent((r) => [w, ...r.filter((x) => x.toLowerCase() !== w.toLowerCase())].slice(0, 12));
    } catch (err) {
      setError(err.message || "Search failed.");
    } finally {
      setLoading(false);
    }
  };

  const removeRecent = (w) => setRecent((r) => r.filter((x) => x !== w));

  const addToList = () => {
    if (!result || !activeList) return;
    updateList(activeList.id, (l) => ({
      ...l,
      words: [freshWord({ word: result.word, def: result.def, vibe: result.vibe, coll: result.coll }), ...l.words],
    }));
    setAdded(true);
  };

  const examples = result ? buildExamples(result) : [];
  const coll = result ? (result.coll || "").split(",").map((c) => c.trim()).filter(Boolean) : [];

  return (
    <div className="max-w-2xl mx-auto px-4 sm:px-8 py-6 sm:py-10">
      <header className="mb-6">
        <p className="text-xs uppercase tracking-[0.2em] text-[color:var(--accent-text)] mb-1">查 · Dictionary</p>
        <h2 className="text-2xl font-semibold text-[color:var(--text)]">Search any word</h2>
        <p className="text-sm text-[color:var(--text-dim)] mt-1">
          Free English definitions for virtually any word{apiKey ? ", plus a Chinese translation and collocations." : ". Add an API key in Settings for Chinese translations too."}
        </p>
      </header>

      <div className="relative mb-6">
        <div className="flex gap-2">
          <div className="relative flex-1">
            <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-[color:var(--text-faint)]" />
            <input value={query}
              onChange={(e) => { setQuery(e.target.value); setShowSuggestions(true); setResult(null); }}
              onFocus={() => setShowSuggestions(true)}
              onBlur={() => setTimeout(() => setShowSuggestions(false), 150)}
              onKeyDown={(e) => e.key === "Enter" && runSearch(query)}
              placeholder="Type a word…" autoFocus
              className="w-full bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] rounded-lg pl-9 pr-3 py-2.5 text-sm text-[color:var(--text)] focus:outline-none focus:ring-emerald-500/50" />
          </div>
          <button onClick={() => runSearch(query)} disabled={loading || !query.trim()}
            className="px-4 rounded-lg bg-emerald-500 text-[#0a0e14] text-sm font-medium hover:bg-emerald-400 disabled:opacity-40 transition flex items-center gap-1.5">
            {loading ? <Loader2 size={15} className="animate-spin" /> : <Search size={15} />}
            Search
          </button>
        </div>

        {showSuggestions && suggestions.length > 0 && (
          <div className="absolute z-10 top-full mt-1.5 left-0 right-16 rounded-lg bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] shadow-lg overflow-hidden animate-float-in">
            {suggestions.map((s, i) => (
              <button key={i} onMouseDown={() => runSearch(s)}
                className="w-full text-left px-3.5 py-2 text-sm text-[color:var(--text)] hover:bg-emerald-500/10 transition flex items-center gap-2">
                <Search size={12} className="text-[color:var(--text-faint)]" /> {s}
              </button>
            ))}
          </div>
        )}
      </div>

      {recent.length > 0 && !result && !loading && (
        <div className="mb-6">
          <div className="flex items-center justify-between mb-2">
            <p className="text-[11px] uppercase tracking-wide text-[color:var(--text-faint)]">Recent searches</p>
            <button onClick={() => setRecent([])} className="text-[11px] text-[color:var(--text-faint)] hover:text-[color:var(--text)]">Clear all</button>
          </div>
          <div className="flex flex-wrap gap-2">
            {recent.map((w, i) => (
              <div key={i} className="group flex items-center gap-1 text-xs pl-2.5 pr-1.5 py-1 rounded-full bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] text-[color:var(--text-dim)] hover:text-[color:var(--text)] hover:ring-emerald-500/30 transition">
                <button onClick={() => runSearch(w)} className="hover:underline">{w}</button>
                <button onClick={() => removeRecent(w)} className="opacity-0 group-hover:opacity-100 text-[color:var(--text-faint)] hover:text-rose-500 transition p-0.5">
                  <X size={11} />
                </button>
              </div>
            ))}
          </div>
        </div>
      )}

      {error && <p className="text-sm text-rose-700 dark:text-rose-300 mb-4">{error}</p>}

      {loading && (
        <div className="flex items-center gap-2 text-sm text-[color:var(--text-faint)]">
          <Loader2 size={14} className="animate-spin" /> Looking it up…
        </div>
      )}

      {result && (
        <div className="rounded-2xl overflow-hidden bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] animate-fade-up">
          <div className="px-6 sm:px-8 py-7 bg-gradient-to-br from-teal-500/25 via-emerald-500/15 to-transparent border-b border-[color:var(--border)]">
            <div className="flex items-start justify-between mb-3">
              <span className="text-2xl">{VIBE_EMOJI[result.vibe] || "✨"}</span>
              {activeList && (
                <button onClick={addToList} disabled={added}
                  className="shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition disabled:opacity-60 bg-emerald-500 text-[#0a0e14] hover:bg-emerald-400 disabled:hover:bg-emerald-500">
                  {added ? <><Check size={13} /> Added</> : <><Plus size={13} /> Add to {activeList.name}</>}
                </button>
              )}
            </div>
            <h3 className="text-4xl sm:text-5xl font-bold text-[color:var(--text)] tracking-tight break-words">{result.word}</h3>
            <p className="text-xs uppercase tracking-widest text-[color:var(--text-faint)] mt-1">{result.vibe}</p>
          </div>

          <div className="px-6 sm:px-8 py-6 space-y-4">
            {result.def && (
              <div>
                <p className="text-[11px] uppercase tracking-wide text-[color:var(--text-faint)] mb-1">Definition</p>
                <p className="text-base text-[color:var(--text)] leading-relaxed">{result.def}</p>
              </div>
            )}

            {result.chinese && (
              <div>
                <p className="text-[11px] uppercase tracking-wide text-[color:var(--text-faint)] mb-1">中文 Chinese</p>
                <p className="text-base text-[color:var(--text)] leading-relaxed">{result.chinese}</p>
              </div>
            )}

            {coll.length > 0 && (
              <div>
                <p className="text-[11px] uppercase tracking-wide text-[color:var(--text-faint)] mb-2">Collocations</p>
                <div className="flex flex-wrap gap-2">
                  {coll.map((c, i) => <span key={i} className="text-xs px-2.5 py-1 rounded-full bg-emerald-500/15 text-[color:var(--accent-text)] ring-1 ring-emerald-500/30">{c}</span>)}
                </div>
              </div>
            )}

            {result.def && (
              <div>
                <p className="text-[11px] uppercase tracking-wide text-[color:var(--text-faint)] mb-2">Example sentences</p>
                <div className="space-y-1.5">
                  {examples.slice(0, 2).map((s, i) => (
                    <p key={i} className="text-sm text-[color:var(--text-dim)] italic leading-relaxed">{s}</p>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------- Practice Sandbox ---------------- */
function Sandbox({ words, apiKey, model, provider, setStats, registerActivity, promptKey }) {
  const [text, setText] = useState("");
  const [loading, setLoading] = useState(false);
  const [feedback, setFeedback] = useState(null);
  const [error, setError] = useState(null);

  const lower = text.toLowerCase();
  const used = useMemo(() => {
    const set = {};
    words.forEach((w) => {
      const re = new RegExp(`\\b${w.word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").toLowerCase()}\\w*`, "i");
      set[w.id] = re.test(lower);
    });
    return set;
  }, [lower, words]);

  const usedWords = words.filter((w) => used[w.id]).map((w) => w.word);

  const analyze = async () => {
    if (!apiKey) { promptKey(); return; }
    if (!text.trim()) return;
    setLoading(true); setError(null); setFeedback(null);

    const system = `You are an expert writing coach for advanced ESL/high-level writers. Evaluate how the student used their target vocabulary in a paragraph. Return ONLY valid JSON (no markdown, no preamble) matching exactly this shape:
{
  "accuracy": [{"word": string, "verdict": "excellent"|"nuance"|"error", "note": string}],
  "collocations": [{"phrase": string, "verdict": "excellent"|"nuance"|"error", "note": string}],
  "rewrite": string,
  "summary": string
}
verdict meanings: "excellent" = correct semantic context and tone; "nuance" = usable but a minor adjustment would sharpen it; "error" = wrong meaning, register, or collocation.`;

    const user = `Target words the student aimed to use: ${words.map((w) => `${w.word} (${w.vibe}; collocations: ${w.coll})`).join(" | ")}
Words detected in the text: ${usedWords.join(", ") || "none"}

Student paragraph:
"""${text}"""

Assess: (1) Contextual accuracy — right meaning and tone per word. (2) Collocation check — natural pairings. (3) A rewrite that sounds more natural/professional. Respond with the JSON only.`;

    try {
      const raw = await callAI({ provider, apiKey, model, system, userText: user, maxTokens: 1500 });
      const clean = raw.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(clean);
      setFeedback(parsed);
      setStats((s) => ({ ...s, sessions: (s.sessions || 0) + 1 }));
      registerActivity();
    } catch (err) {
      setError(err.message || "Something went wrong.");
    } finally {
      setLoading(false);
    }
  };

  const vColor = (v) => ({
    excellent: "text-emerald-700 dark:text-emerald-100 bg-emerald-500/10 dark:bg-emerald-500/15 ring-emerald-500/30",
    nuance: "text-amber-700 dark:text-amber-100 bg-amber-500/10 dark:bg-amber-500/15 ring-amber-500/30",
    error: "text-rose-700 dark:text-rose-100 bg-rose-500/10 dark:bg-rose-500/15 ring-rose-500/30",
  }[v] || "text-[color:var(--text-dim)] bg-[color:var(--surface2)] ring-[color:var(--border)]");

  return (
    <div className="h-full flex flex-col">
      <header className="px-4 sm:px-8 pt-6 sm:pt-8 pb-4 shrink-0">
        <p className="text-xs uppercase tracking-[0.2em] text-[color:var(--accent-text)] mb-1">写 · Practice Sandbox</p>
        <h2 className="text-2xl font-semibold text-[color:var(--text)]">Write, then let {PROVIDERS[provider].short} read it back</h2>
      </header>

      <div className="flex-1 grid grid-cols-1 md:grid-cols-[280px_1fr] gap-0 min-h-0 border-t border-[color:var(--border)]">
        <div className="border-r border-[color:var(--border)] border-b md:border-b-0 overflow-y-auto p-5 max-h-56 md:max-h-none">
          <p className="text-[11px] uppercase tracking-wide text-[color:var(--text-dim)] mb-3">Target checklist</p>
          <div className="space-y-2">
            {words.map((w) => {
              const on = used[w.id];
              return (
                <div key={w.id} className={`flex items-center gap-2.5 px-3 py-2 rounded-lg ring-1 transition ${
                  on ? "bg-emerald-500/15 ring-emerald-500/40" : "bg-[color:var(--surface)] ring-[color:var(--border)]"}`}>
                  <div className={`h-4 w-4 rounded flex items-center justify-center transition ${
                    on ? "bg-emerald-500" : "ring-1 ring-[color:var(--text-faint)]"}`}>
                    {on && <Check size={12} className="text-[#0a0e14]" strokeWidth={3} />}
                  </div>
                  <span className={`text-sm ${on ? "text-[color:var(--accent-text)]" : "text-[color:var(--text-dim)]"}`}>{w.word}</span>
                </div>
              );
            })}
          </div>
          <p className="text-[11px] text-[color:var(--text-faint)] mt-4">{usedWords.length} of {words.length} used</p>
        </div>

        <div className="overflow-y-auto p-6 flex flex-col">
          <div className="relative">
            <textarea value={text} onChange={(e) => setText(e.target.value)}
              placeholder="Write your paragraph here. Aim to work in the target words naturally…"
              className="w-full h-64 bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] rounded-xl p-5 text-[15px] leading-relaxed text-[color:var(--text)] focus:outline-none focus:ring-emerald-500/40 resize-none" />
            <span className="absolute bottom-3 right-4 text-[11px] text-[color:var(--text-faint)]">{text.length} chars</span>
          </div>

          <div className="flex justify-end mt-4">
            <button onClick={analyze} disabled={loading}
              className="flex items-center gap-2 px-5 py-2.5 rounded-lg bg-gradient-to-r from-emerald-500 to-teal-500 text-[#0a0e14] text-sm font-semibold hover:from-emerald-400 hover:to-teal-400 disabled:opacity-50 transition">
              {loading ? <Loader2 size={16} className="animate-spin" /> : <Sparkles size={16} />}
              {loading ? "Analyzing…" : `Analyze with ${PROVIDERS[provider].short}`}
            </button>
          </div>

          {error && (
            <div className="mt-4 rounded-lg bg-rose-500/15 ring-1 ring-rose-500/30 px-4 py-3 text-sm text-rose-700 dark:text-rose-100">
              {error}
            </div>
          )}

          {feedback && (
            <div className="mt-6 space-y-6">
              {feedback.summary && (
                <p className="text-sm text-[color:var(--text-dim)] leading-relaxed border-l-2 border-emerald-500/50 pl-4">{feedback.summary}</p>
              )}

              <FeedbackBlock title="Contextual accuracy" items={feedback.accuracy} labelKey="word" vColor={vColor} />
              <FeedbackBlock title="Collocation check" items={feedback.collocations} labelKey="phrase" vColor={vColor} />

              {feedback.rewrite && (
                <div>
                  <p className="text-[11px] uppercase tracking-wide text-[color:var(--text-dim)] mb-2">Suggested rewrite</p>
                  <div className="rounded-xl bg-[color:var(--surface2)] ring-1 ring-emerald-500/25 p-5">
                    <p className="text-[15px] text-[color:var(--text)] leading-relaxed">{feedback.rewrite}</p>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function FeedbackBlock({ title, items, labelKey, vColor }) {
  if (!items || items.length === 0) return null;
  return (
    <div>
      <p className="text-[11px] uppercase tracking-wide text-[color:var(--text-dim)] mb-2">{title}</p>
      <div className="space-y-2">
        {items.map((it, i) => (
          <div key={i} className={`rounded-lg ring-1 px-4 py-3 ${vColor(it.verdict)}`}>
            <div className="flex items-center gap-2 mb-1">
              <span className="text-sm font-medium">{it[labelKey]}</span>
              <span className="text-[10px] uppercase tracking-wide opacity-80">{it.verdict}</span>
            </div>
            <p className="text-sm opacity-95 leading-relaxed">{it.note}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------------- Key Modal ---------------- */
function Confetti() {
  const colors = ["#34d399", "#38bdf8", "#f472b6", "#fbbf24", "#a78bfa"];
  const pieces = useMemo(() => Array.from({ length: 24 }, (_, i) => ({
    left: Math.random() * 100,
    delay: Math.random() * 0.3,
    duration: 0.9 + Math.random() * 0.6,
    color: colors[i % colors.length],
    rotate: Math.random() * 180,
  })), []);
  return (
    <div className="pointer-events-none absolute inset-x-0 top-0 h-0 overflow-visible z-10">
      {pieces.map((p, i) => (
        <span key={i} className="confetti-piece" style={{
          left: `${p.left}%`, background: p.color,
          animationDelay: `${p.delay}s`, animationDuration: `${p.duration}s`,
          transform: `rotate(${p.rotate}deg)`,
        }} />
      ))}
    </div>
  );
}

function KeyModal({ onClose, onGo }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm px-6" onClick={onClose}>
      <div className="w-full max-w-md rounded-2xl bg-[color:var(--surface)] ring-1 ring-[color:var(--border)] p-8 shadow-2xl text-center" onClick={(e) => e.stopPropagation()}>
        <div className="h-14 w-14 rounded-2xl bg-amber-500/15 ring-1 ring-amber-500/30 flex items-center justify-center mx-auto mb-5">
          <Key className="text-amber-500 dark:text-amber-400" size={24} />
        </div>
        <h3 className="text-lg font-semibold text-[color:var(--text)] mb-2">Add your API key first</h3>
        <p className="text-sm text-[color:var(--text-dim)] mb-6 leading-relaxed">
          An AI API key is needed to analyze your writing. Add one (Claude, Gemini, or GPT) in Settings — it stays in your browser.
        </p>
        <div className="flex gap-2">
          <button onClick={onClose} className="flex-1 px-4 py-2.5 rounded-lg text-sm text-[color:var(--text-dim)] hover:text-[color:var(--text)] ring-1 ring-[color:var(--border)]">Not now</button>
          <button onClick={onGo} className="flex-1 px-4 py-2.5 rounded-lg bg-emerald-500 text-[#0a0e14] text-sm font-medium hover:bg-emerald-400">Go to Settings</button>
        </div>
      </div>
    </div>
  );
}

function Root() {
  const [authed, setAuthed] = useState(() => load(LS.loggedIn, false));
  CURRENT_EMAIL = load(LS.currentEmail, null);

  useEffect(() => {
    const theme = load(LS.theme, "dark");
    const eff = theme === "system" ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : theme;
    document.documentElement.setAttribute("data-theme", eff);
  }, []);

  if (!authed || !CURRENT_EMAIL) return <AuthGate onAuth={() => setAuthed(true)} />;
  return <App key={CURRENT_EMAIL} onLogout={() => { save(LS.loggedIn, false); setAuthed(false); }} />;
}
